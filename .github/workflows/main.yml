name: Build ScummVM Libretro Core V52 (Fixed VorbisStream EOF Decode for .he4/.he2 + LVD1 Palette Preload)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: scummvm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone & Patch ScummVM v2026.4.0
        run: |
          rm -rf scummvm-2026.4.0
          git clone --depth 1 --branch v2026.4.0 https://github.com/scummvm/scummvm.git scummvm-2026.4.0
          cd scummvm-2026.4.0

          python3 - << 'EOF'
          import os, re

          # 1. Enable scumm, scumm_7_8, he, and mediastation
          for name in ["lite_engines.list", "engines.lite"]:
              with open(os.path.join("backends/platform/libretro", name), "w") as f:
                  f.write("scumm\nscumm_7_8\nhe\nmediastation\n")
          ms_cfg = "engines/mediastation/configure.engine"
          if os.path.exists(ms_cfg):
              mtxt = open(ms_cfg, "r").read()
              open(ms_cfg, "w").write(re.sub(r'\badd_engine\s+mediastation\s+"([^"]+)"\s+\w+', r'add_engine mediastation "\1" yes', mtxt))

          # 2. Generic detection unlock + auto-accept unsupported/repacked game warning
          adv = "engines/advancedDetector.cpp"
          at = open(adv, errors="ignore").read()
          at = re.sub(r"\breturn\s+matched\s*;", "{ for (uint _i = 0; _i < matched.size(); ++_i) matched[_i].hasUnknownFiles = false; return matched; }", at)
          at = re.sub(r"(\bhasUnknownFiles\s*=\s*)adGame\.hasUnknownFiles\b", r"\1false", at)
          at = re.sub(r"(bool\s+cleanupPirated\s*\([^)]*\)\s*\{)", r"\1 return false;", at)
          open(adv, "w").write(at)

          for sdir in ["engines", "gui", "base"]:
              for root, _, files in os.walk(sdir):
                  for fn in files:
                      if not fn.endswith((".cpp", ".h")): continue
                      fp = os.path.join(root, fn)
                      t = open(fp, errors="ignore").read()
                      nt = re.sub(r"(bool\s+(?:[A-Za-z0-9_]+::)?warnUserAboutUnsupportedGame\s*\([^)]*\)\s*\{)", r"\1 return true;", t)
                      if fn == "launcher.cpp": nt = re.sub(r"\b(\w+(?:\[\w+\])?)\.hasUnknownFiles\b", "false", nt)
                      if "detection" in fn and ("ADGF_UNSTABLE" in nt or "ADGF_TESTING" in nt):
                          nt = re.sub(r"\bADGF_(?:UNSTABLE|TESTING)\b", "0", nt)
                      if nt != t: open(fp, "w").write(nt)

          # 3. Enable USE_BINK=1 + USE_TREMOR=1 + USE_OGG=1 (static integer Ogg Vorbis) while disabling unused libs
          for mk in ["backends/imgui/module.mk", "backends/networking/basic/module.mk", "backends/networking/curl/module.mk", "backends/networking/http/module.mk", "backends/networking/sdl_net/module.mk", "backends/cloud/module.mk"]:
              if os.path.exists(mk): open(mk, "w").write("# Disabled\n")
          if os.path.exists("configure"):
              cfg = open("configure", errors="ignore").read()
              cfg = re.sub(r"^\s*add_component\s+imgui\b.*$", "# disabled imgui", cfg, flags=re.M)
              cfg = re.sub(r"^([ \t]*_bink=).*$", r"\1yes", cfg, flags=re.M)
              open("configure", "w").write(cfg)

          ssys = "common/scummsys.h"
          if os.path.exists(ssys):
              stxt = open(ssys, errors="ignore").read()
              defs_inj = (
                  r'\1' + '\n#ifndef USE_BINK\n#define USE_BINK 1\n#endif\n'
                  '#ifndef USE_TREMOR\n#define USE_TREMOR 1\n#endif\n'
                  '#ifndef USE_VORBIS\n#define USE_VORBIS 1\n#endif\n'
                  '#ifndef USE_OGG\n#define USE_OGG 1\n#endif'
              )
              stxt, n_ss = re.subn(r'(#include\s+"config\.h")', defs_inj, stxt, count=1)
              assert n_ss == 1 and len(stxt) > 1000, "Failed to patch common/scummsys.h"
              open(ssys, "w").write(stxt)

          dis = ["USE_IMGUI", "USE_CURL", "USE_LIBCURL", "USE_CLOUD", "USE_BASIC_NET", "USE_SDL_NET", "USE_ALSA", "USE_SEQ_MIDI", "USE_SNDIO", "USE_TIMIDITY", "USE_FLUIDSYNTH", "USE_MT32EMU", "USE_FREETYPE2", "USE_FRIBIDI", "USE_MPEG2", "USE_THEORADEC", "USE_VPX", "USE_FAAD", "USE_AAC", "USE_VORBIS", "USE_FLAC", "USE_MAD", "USE_MPCDEC", "USE_OPENMPT", "USE_MIKMOD", "USE_TTS", "USE_DISCORD", "USE_RETROACHIEVEMENTS", "USE_GTK", "USE_SYSDIALOGS", "USE_UNITY", "OPENGL_SUPPORT", "USE_OPENGL", "HAVE_OPENGL"]
          for mr in ["backends/platform/libretro/Makefile", "backends/platform/libretro/Makefile.common", "backends/platform/libretro/dependencies.mk"]:
              if os.path.exists(mr):
                  t = re.sub(r"SHARED_([A-Z0-9_]+)\s*:?=\s*1", r"SHARED_\1 := 0", open(mr, "r").read())
                  for v in dis: t = re.sub(rf"\b{v}\s*[:?]?=\s*1\b", f"{v} := 0", t)
                  t = re.sub(r"\bUSE_BINK\s*[:?]?=\s*0\b", "USE_BINK := 1", t)
                  t = re.sub(r"\bUSE_TREMOR\s*[:?]?=\s*0\b", "USE_TREMOR := 1", t)
                  t = re.sub(r"\bUSE_OGG\s*[:?]?=\s*0\b", "USE_OGG := 1", t)
                  open(mr, "w").write(t)

          vp = "|".join(v for v in dis if v != "USE_VORBIS")
          id_re, in_re = re.compile(rf"^(\s*)ifdef\s+({vp})\s*$", flags=re.M), re.compile(rf"^(\s*)ifndef\s+({vp})\s*$", flags=re.M)
          vorb_id_re, vorb_in_re = re.compile(r"^(\s*)ifdef\s+USE_VORBIS\s*$", flags=re.M), re.compile(r"^(\s*)ifndef\s+USE_VORBIS\s*$", flags=re.M)
          for root, _, files in os.walk("."):
              in_lr = "backends/platform/libretro" in root.replace("\\", "/")
              for fn in files:
                  if fn.endswith(".mk") or fn in ("Makefile", "Makefile.common"):
                      fp = os.path.join(root, fn)
                      mt = open(fp, errors="ignore").read()
                      nm = in_re.sub(r"\1ifneq ($(\2), 1)", id_re.sub(r"\1ifeq ($(\2), 1)", mt))
                      # Keep USE_VORBIS=0 in libretro dependencies.mk (no float libvorbis),
                      # but enable decoders/vorbis.o in audio/module.mk when USE_TREMOR=1
                      vvar = "USE_VORBIS" if in_lr else "USE_TREMOR"
                      nm = vorb_in_re.sub(rf"\1ifneq ($({vvar}), 1)", vorb_id_re.sub(rf"\1ifeq ($({vvar}), 1)", nm))
                      if nm != mt: open(fp, "w").write(nm)

          csh = "backends/platform/libretro/scripts/configure_engines.sh"
          if os.path.exists(csh):
              st = open(csh, "r").read().replace("--disable-bink", "--enable-bink").replace("--disable-tremor", "--enable-tremor").replace("--disable-vorbis", "--enable-tremor")
              for fl in ["libcurl", "cloud", "basic-net", "alsa"]: st = st.replace(f"--enable-{fl}", f"--disable-{fl}")
              open(csh, "w").write(st)

          # 4. 44100Hz + POINTER + lock timing_inaccuracies/speed_hack OFF + mute yellow OSD warnings
          defs_p = "backends/platform/libretro/include/libretro-defs.h"
          if os.path.exists(defs_p):
              dt = open(defs_p, "r").read()
              open(defs_p, "w").write(re.sub(r"(#define\s+DEFAULT_SAMPLE_RATE\s+)\d+", r"\g<1>44100", dt))

          for root, _, files in os.walk("backends/platform/libretro"):
              for fn in files:
                  if not fn.endswith((".cpp", ".h")): continue
                  fp = os.path.join(root, fn)
                  st = open(fp, errors="ignore").read()
                  ns = re.sub(r"(int\s+retro_setting_get_pointer_device\s*\(\s*(?:void)?\s*\)\s*\{)", r"\1 return RETRO_DEVICE_POINTER;", st)
                  ns = re.sub(r"(bool\s+retro_setting_get_timing_inaccuracies_enabled\s*\(\s*(?:void)?\s*\)\s*\{)", r"\1 return false;", ns)
                  ns = re.sub(r"(void\s+retro_osd_notification\s*\([^)]*\)\s*\{)", r"\1 return;", ns)
                  ns = ns.replace("pointer_device = RETRO_DEVICE_JOYPAD", "pointer_device = RETRO_DEVICE_POINTER")
                  ns = ns.replace("pointer_device = RETRO_DEVICE_MOUSE", "pointer_device = RETRO_DEVICE_POINTER")
                  if ns != st: open(fp, "w").write(ns)

          # 5a. LVD1 320x240 Paletted XOR-Delta Zlib + Ogg Decoder inside video/smk_decoder.cpp (with full SMK2/SMK4 fallback)
          vd_p = "video/video_decoder.h"
          vd_t, n_vd = re.subn(
              r"(class\s+VideoDecoder\b[^;{]*\{)",
              r"\1\n\tfriend class LeapLvdAudioTrack;\n\tfriend class LeapLvdVideoTrack;",
              open(vd_p, "r").read(), count=1
          )
          assert n_vd == 1, "Failed to patch video/video_decoder.h"
          open(vd_p, "w").write(vd_t)

          smk_p = "video/smk_decoder.cpp"
          smk_t = open(smk_p, "r").read()
          lvd_classes = """#define FORBIDDEN_SYMBOL_ALLOW_ALL
          #include <zlib.h>
          #include "common/memstream.h"
          #include "audio/audiostream.h"
          #include "audio/decoders/vorbis.h"
          """
          smk_track_defs = """namespace Video {

          class LeapLvdAudioTrack : public VideoDecoder::AudioTrack {
          \tAudio::AudioStream *_stream;
          public:
          \tLeapLvdAudioTrack(Audio::AudioStream *s, Audio::Mixer::SoundType t) : AudioTrack(t), _stream(s) {}
          \t~LeapLvdAudioTrack() override { delete _stream; }
          protected:
          \tAudio::AudioStream *getAudioStream() const override { return _stream; }
          };

          class LeapLvdVideoTrack : public VideoDecoder::FixedRateVideoTrack {
          \tCommon::SeekableReadStream *_stream;
          \tuint16 _origW, _origH, _encW, _encH;
          \tuint32 _frameCount, _frameUs;
          \tint _curFrame;
          \tCommon::Array<uint32> _offsets;
          \tCommon::Array<byte> _idxBuf, _compBuf, _unpBuf;
          \tGraphics::Surface _surface;
          \tbyte _palette[3 * 256];
          \tmutable bool _dirtyPalette;
          public:
          \tLeapLvdVideoTrack(Common::SeekableReadStream *s, uint16 ow, uint16 oh, uint16 ew, uint16 eh, uint32 fc, uint32 fu, const Common::Array<uint32> &offs)
          \t\t: _stream(s), _origW(ow), _origH(oh), _encW(ew), _encH(eh), _frameCount(fc), _frameUs(fu ? fu : 66667U), _curFrame(-1), _offsets(offs), _dirtyPalette(false) {
          \t\tmemset(_palette, 0, sizeof(_palette));
          \t\t_surface.create(_origW, _origH, Graphics::PixelFormat::createFormatCLUT8());
          \t\t_idxBuf.resize((uint32)_encW * (uint32)_encH, 0);
          \t\t_unpBuf.resize(1U + 768U + (uint32)_encW * (uint32)_encH + 64U, 0);
          \t\tif (_frameCount > 0 && _stream && _offsets.size() >= 2 && _offsets[1] > _offsets[0]) {
          \t\t\tuint32 csz0 = _offsets[1] - _offsets[0];
          \t\t\tint64 savePos = _stream->pos();
          \t\t\t_compBuf.resize(csz0);
          \t\t\t_stream->seek(_offsets[0], SEEK_SET);
          \t\t\tif (_stream->read(_compBuf.data(), csz0) == csz0) {
          \t\t\t\tuLongf ulen = (uLongf)_unpBuf.size();
          \t\t\t\tif (uncompress((Bytef *)_unpBuf.data(), &ulen, (const Bytef *)_compBuf.data(), (uLong)csz0) == Z_OK && ulen >= 769U && (_unpBuf[0] & 1)) {
          \t\t\t\t\tmemcpy(_palette, _unpBuf.data() + 1, 768U);
          \t\t\t\t\t_dirtyPalette = true;
          \t\t\t\t}
          \t\t\t}
          \t\t\t_stream->seek(savePos, SEEK_SET);
          \t\t}
          \t}
          \t~LeapLvdVideoTrack() override { _surface.free(); }
          \tuint16 getWidth() const override { return _origW; }
          \tuint16 getHeight() const override { return _origH; }
          \tGraphics::PixelFormat getPixelFormat() const override { return Graphics::PixelFormat::createFormatCLUT8(); }
          \tint getCurFrame() const override { return _curFrame; }
          \tint getFrameCount() const override { return (int)_frameCount; }
          \tbool isRewindable() const override { return true; }
          \tbool rewind() override { _curFrame = -1; memset(_idxBuf.data(), 0, _idxBuf.size()); return true; }
          \tconst byte *getPalette() const override { _dirtyPalette = false; return _palette; }
          \tbool hasDirtyPalette() const override { return _dirtyPalette; }
          \tconst Graphics::Surface *decodeNextFrame() override {
          \t\tif (_curFrame + 1 >= (int)_frameCount) return &_surface;
          \t\t_curFrame++;
          \t\tuint32 off0 = _offsets[_curFrame], off1 = _offsets[_curFrame + 1];
          \t\tuint32 csz = (off1 > off0) ? (off1 - off0) : 0;
          \t\tif (csz > 0 && _stream) {
          \t\t\tif (_compBuf.size() < csz) _compBuf.resize(csz);
          \t\t\t_stream->seek(off0, SEEK_SET);
          \t\t\tif (_stream->read(_compBuf.data(), csz) == csz) {
          \t\t\t\tuLongf ulen = (uLongf)_unpBuf.size();
          \t\t\t\tif (uncompress((Bytef *)_unpBuf.data(), &ulen, (const Bytef *)_compBuf.data(), (uLong)csz) == Z_OK && ulen >= 1) {
          \t\t\t\t\tbyte pf = _unpBuf[0];
          \t\t\t\t\tuint32 pos = 1;
          \t\t\t\t\tif ((pf & 1) && pos + 768U <= ulen) {
          \t\t\t\t\t\tmemcpy(_palette, _unpBuf.data() + pos, 768U);
          \t\t\t\t\t\tpos += 768U;
          \t\t\t\t\t\t_dirtyPalette = true;
          \t\t\t\t\t}
          \t\t\t\t\tuint32 npix = (uint32)_encW * (uint32)_encH;
          \t\t\t\t\tif (pos + npix <= ulen) {
          \t\t\t\t\t\tif (pf & 2) {
          \t\t\t\t\t\t\tmemcpy(_idxBuf.data(), _unpBuf.data() + pos, npix);
          \t\t\t\t\t\t} else {
          \t\t\t\t\t\t\tconst byte *dl = _unpBuf.data() + pos;
          \t\t\t\t\t\t\tbyte *ix = _idxBuf.data();
          \t\t\t\t\t\t\tfor (uint32 i = 0; i < npix; ++i) ix[i] ^= dl[i];
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t\tif (_origW == _encW * 2 && _origH == _encH * 2) {
          \t\t\t\t\t\tfor (uint16 y = 0; y < _encH; ++y) {
          \t\t\t\t\t\t\tconst byte *sr = _idxBuf.data() + (uint32)y * _encW;
          \t\t\t\t\t\t\tbyte *d0 = (byte *)_surface.getBasePtr(0, y * 2);
          \t\t\t\t\t\t\tbyte *d1 = (byte *)_surface.getBasePtr(0, y * 2 + 1);
          \t\t\t\t\t\t\tfor (uint16 x = 0; x < _encW; ++x) {
          \t\t\t\t\t\t\t\tbyte c = sr[x];
          \t\t\t\t\t\t\t\td0[x * 2] = c;
          \t\t\t\t\t\t\t\td0[x * 2 + 1] = c;
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\tmemcpy(d1, d0, _origW);
          \t\t\t\t\t\t}
          \t\t\t\t\t} else if (_origW == _encW && _origH == _encH) {
          \t\t\t\t\t\tfor (uint16 y = 0; y < _encH; ++y)
          \t\t\t\t\t\t\tmemcpy(_surface.getBasePtr(0, y), _idxBuf.data() + (uint32)y * _encW, _encW);
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t\treturn &_surface;
          \t}
          protected:
          \tCommon::Rational getFrameRate() const override { return Common::Rational(1000000, (int)_frameUs); }
          };
          """
          lvd_load_hook = """_header.signature = _fileStream->readUint32BE();
          \tif (_header.signature == MKTAG('L', 'V', 'D', '1')) {
          \t\tuint16 origW = _fileStream->readUint16LE();
          \t\tuint16 origH = _fileStream->readUint16LE();
          \t\tuint16 encW  = _fileStream->readUint16LE();
          \t\tuint16 encH  = _fileStream->readUint16LE();
          \t\tuint32 fcnt  = _fileStream->readUint32LE();
          \t\tuint32 fus   = _fileStream->readUint32LE();
          \t\tuint32 olen  = _fileStream->readUint32LE();
          \t\tif (fcnt == 0 || fcnt > 100000U) return false;
          \t\tCommon::Array<uint32> offs(fcnt + 1U);
          \t\tfor (uint32 i = 0; i <= fcnt; ++i) offs[i] = _fileStream->readUint32LE();
          \t\t_firstFrameStart = offs[0];
          \t\taddTrack(new LeapLvdVideoTrack(_fileStream, origW, origH, encW, encH, fcnt, fus, offs));
          \t\tif (olen > 0U) {
          \t\t\tbyte *obuf = (byte *)malloc(olen);
          \t\t\tif (obuf && _fileStream->read(obuf, olen) == olen) {
          \t\t\t\tCommon::SeekableReadStream *ms = new Common::MemoryReadStream(obuf, olen, DisposeAfterUse::YES);
          \t\t\t\tAudio::RewindableAudioStream *vs = Audio::makeVorbisStream(ms, DisposeAfterUse::YES);
          \t\t\t\tif (vs) addTrack(new LeapLvdAudioTrack(vs, getSoundType()));
          \t\t\t} else {
          \t\t\t\tfree(obuf);
          \t\t\t}
          \t\t}
          \t\treturn true;
          \t}"""

          smk_t = lvd_classes + smk_t.replace("namespace Video {", smk_track_defs, 1)
          smk_t, n_sl = re.subn(r"_header\.signature\s*=\s*_fileStream->readUint32BE\(\);", lambda _: lvd_load_hook, smk_t, count=1)
          smk_t, n_sr = re.subn(r"(void\s+SmackerDecoder::readNextPacket\s*\(\s*\)\s*\{)", r"\1 if (_header.signature == MKTAG('L', 'V', 'D', '1')) return;", smk_t, count=1)
          smk_t, n_sf = re.subn(
              r"(const\s+Graphics::Surface\s*\*\s*SmackerDecoder::forceSeekToFrame\s*\(\s*uint\s+(\w+)\s*\)\s*\{)",
              r"\1 if (_header.signature == MKTAG('L', 'V', 'D', '1')) { if (!isVideoLoaded() || \2 >= getFrameCount() || !rewind()) return nullptr; const Graphics::Surface *_s = nullptr; for (uint _i = 0; _i <= \2; ++_i) _s = decodeNextFrame(); return _s; }",
              smk_t, count=1
          )
          assert n_sl == 1 and n_sr == 1, f"Failed to patch smk_decoder.cpp: {n_sl},{n_sr},{n_sf}"
          open(smk_p, "w").write(smk_t)

          # 5b. V52 Complete HE98 LPOG->PCM Inflator (Fixes VorbisStream endOfData Premature Stop in .he4 & .he2 + hsStartDigitalSound Talkie Slot 1 + Multi-Chunk LPOG)
          ogg_engine_cpp = """#define FORBIDDEN_SYMBOL_ALLOW_ALL
          #include <stdlib.h>
          #include <string.h>
          #include "common/array.h"
          #include "common/endian.h"
          #include "common/memstream.h"
          #include "audio/audiostream.h"
          #include "audio/decoders/raw.h"
          #include "audio/decoders/vorbis.h"

          namespace Audio {

          static int32 leapFindCompleteOggLength(const byte *b, uint32 n) {
          \tuint32 pos = 0;
          \twhile (pos + 27U <= n) {
          \t\tif (b[pos] != 'O' || b[pos + 1] != 'g' || b[pos + 2] != 'g' || b[pos + 3] != 'S' || b[pos + 4] != 0)
          \t\t\treturn -1;
          \t\tbyte htype = b[pos + 5];
          \t\tuint32 nseg = b[pos + 26];
          \t\tif (pos + 27U + nseg > n)
          \t\t\treturn 0;
          \t\tuint32 body = 0;
          \t\tfor (uint32 i = 0; i < nseg; ++i)
          \t\t\tbody += b[pos + 27U + i];
          \t\tuint32 pageLen = 27U + nseg + body;
          \t\tif (pos + pageLen > n)
          \t\t\treturn 0;
          \t\tpos += pageLen;
          \t\tif ((htype & 0x04) != 0)
          \t\t\treturn (int32)pos;
          \t}
          \treturn 0;
          }

          class LeapSilenceStream : public AudioStream {
          \tint _rate;
          \tbool _stereo;
          \tint _remSamples;
          public:
          \tLeapSilenceStream(int rate, bool stereo, int frames = 2048)
          \t\t: _rate(rate > 0 ? rate : 11025), _stereo(stereo), _remSamples(frames * (stereo ? 2 : 1)) {}
          \tint readBuffer(int16 *buffer, const int numSamples) override {
          \t\tif (_remSamples <= 0 || numSamples <= 0)
          \t\t\treturn 0;
          \t\tint n = (numSamples < _remSamples) ? numSamples : _remSamples;
          \t\tif (_stereo) n &= ~1;
          \t\tif (n <= 0) return 0;
          \t\tmemset(buffer, 0, (size_t)n * sizeof(int16));
          \t\t_remSamples -= n;
          \t\treturn n;
          \t}
          \tbool isStereo() const override { return _stereo; }
          \tint getRate() const override { return _rate; }
          \tbool endOfData() const override { return _remSamples <= 0; }
          };

          class LeapRateMatchStream : public AudioStream {
          \tAudioStream *_src;
          \tint _srcRate, _dstRate;
          \tbool _srcStereo, _dstStereo;
          \tuint32 _stepFp, _posFp;
          \tint _prevL, _prevR, _curL, _curR;
          \tbool _primed, _eof;
          \tint16 _inBuf[1024];
          \tint _inFrames, _inIdx;

          \tbool pullNextSrcFrame() {
          \t\tif (_eof || !_src)
          \t\t\treturn false;
          \t\twhile (_inIdx >= _inFrames) {
          \t\t\tint wantSamples = _srcStereo ? 1024 : 512;
          \t\t\tint got = _src->readBuffer(_inBuf, wantSamples);
          \t\t\tif (got <= 0) {
          \t\t\t\t_eof = true;
          \t\t\t\treturn false;
          \t\t\t}
          \t\t\t_inFrames = _srcStereo ? (got / 2) : got;
          \t\t\t_inIdx = 0;
          \t\t\tif (_inFrames <= 0) {
          \t\t\t\t_eof = true;
          \t\t\t\treturn false;
          \t\t\t}
          \t\t}
          \t\t_prevL = _curL;
          \t\t_prevR = _curR;
          \t\tif (_srcStereo) {
          \t\t\t_curL = _inBuf[_inIdx * 2];
