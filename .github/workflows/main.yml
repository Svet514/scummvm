name: Build ScummVM Libretro Core (Leapster Cortex-A9 32-bit Color)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Compile ScummVM Libretro Core Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -c '
            set -e
            set -o pipefail

            # 1. Install ARMv7 softfp cross-compiler, git, and build tools
            apt-get update
            apt-get install -y \
              git \
              ca-certificates \
              pkg-config \
              gcc-arm-linux-gnueabi \
              g++-arm-linux-gnueabi \
              binutils-arm-linux-gnueabi \
              make \
              wget \
              tar \
              zip \
              unzip \
              sed \
              gawk \
              python3

            # 2. Clone official ScummVM v2026.4.0 with .git metadata intact for Libretro submodule scripts
            rm -rf scummvm-2026.4.0
            git clone --depth 1 --branch v2026.4.0 https://github.com/scummvm/scummvm.git scummvm-2026.4.0
            cd scummvm-2026.4.0

            # 3. Configure strictly for SCUMM engine, keep 32-bit color (HIGH_DEF=1), and undefine curl/cloud/alsa/opengl
            python3 - << "PYEOF"
          import os
          import re

          # 3A. Write ONLY scumm (+ v7/v8 and HE sub-engines) to lite_engines.list and engines.lite
          lite_content = "scumm\nscumm_7_8\nhe\n"
          for list_name in ["lite_engines.list", "engines.lite"]:
              p = os.path.join("backends/platform/libretro", list_name)
              with open(p, "w") as f:
                  f.write(lite_content)

          # 3B. Stub out networking/cloud module.mk files so curl/socket.cpp & url.cpp can never be added
          for mod_mk in [
              "backends/networking/basic/module.mk",
              "backends/networking/curl/module.mk",
              "backends/networking/http/module.mk",
              "backends/networking/sdl_net/module.mk",
              "backends/cloud/module.mk"
          ]:
              if os.path.exists(mod_mk):
                  with open(mod_mk, "w") as f:
                      f.write("# Disabled for Leapster offline build\n")
                  print(f"Stubbed {mod_mk}!")

          # 3C. Disable unwanted features in backends/platform/libretro/{Makefile,Makefile.common,dependencies.mk}
          disable_vars = [
              "USE_CURL", "USE_LIBCURL", "USE_CLOUD", "USE_BASIC_NET", "USE_SDL_NET",
              "USE_ALSA", "USE_SEQ_MIDI", "USE_SNDIO", "USE_TIMIDITY", "USE_FLUIDSYNTH",
              "USE_MT32EMU", "USE_FREETYPE2", "USE_FRIBIDI", "USE_MPEG2", "USE_THEORADEC",
              "USE_FAAD", "USE_AAC", "USE_VORBIS", "USE_TREMOR", "USE_FLAC", "USE_MAD",
              "USE_OGG", "USE_MPCDEC", "USE_OPENMPT", "USE_MIKMOD", "USE_BINK", "USE_TTS",
              "USE_DISCORD", "USE_RETROACHIEVEMENTS", "OPENGL_SUPPORT", "USE_OPENGL",
              "HAVE_OPENGL"
          ]

          for mk_rel in [
              "backends/platform/libretro/Makefile",
              "backends/platform/libretro/Makefile.common",
              "backends/platform/libretro/dependencies.mk"
          ]:
              if os.path.exists(mk_rel):
                  with open(mk_rel, "r") as f:
                      txt = f.read()
                  txt = re.sub(r"SHARED_([A-Z0-9_]+)\s*:?=\s*1", r"SHARED_\1 := 0", txt)
                  for v in disable_vars:
                      txt = re.sub(rf"\b{v}\s*[:?]?=\s*1\b", f"{v} := 0", txt)
                  with open(mk_rel, "w") as f:
                      f.write(txt)
                  print(f"Sanitized {mk_rel}!")

          # 3D. Append undefine directives to Makefile.common right after config.mk is included
          #     Because ScummVM module.mk files use `ifdef USE_FOO` (which is true even if USE_FOO=0!),
          #     we must `undefine` them so `ifdef USE_FOO` evaluates to FALSE.
          mk_common = "backends/platform/libretro/Makefile.common"
          with open(mk_common, "r") as f:
              mc = f.read()

          undef_block = "\n# Force undefine for ScummVM module.mk ifdef checks\n"
          for v in disable_vars:
              undef_block += f"override undefine {v}\n"

          # Insert undef_block before the first `include $(SCUMMVM_PATH)/` module inclusion
          assert "SCUMMVM_PATH" in mc, "SCUMMVM_PATH not found in Makefile.common"
          mc = re.sub(
              r"(include\s+\$\(SCUMMVM_PATH\)/engines/engines\.mk)",
              undef_block + r"\n\1",
              mc,
              count=1
          )
          # Also remove any networking/cloud module directories if listed in MODULES
          mc = mc.replace("backends/networking/basic", "")
          mc = mc.replace("backends/networking/curl", "")
          mc = mc.replace("backends/networking/http", "")
          mc = mc.replace("backends/cloud", "")
          with open(mk_common, "w") as f:
              f.write(mc)
          print("Injected `override undefine` block into backends/platform/libretro/Makefile.common!")

          # 3E. Patch scripts/configure_engines.sh to disable curl/cloud/basic-net/alsa
          cfg_sh = "backends/platform/libretro/scripts/configure_engines.sh"
          if os.path.exists(cfg_sh):
              with open(cfg_sh, "r") as f:
                  sh_txt = f.read()
              sh_txt = sh_txt.replace("--enable-libcurl", "--disable-libcurl")
              sh_txt = sh_txt.replace("--enable-cloud", "--disable-cloud")
              sh_txt = sh_txt.replace("--enable-basic-net", "--disable-basic-net")
              sh_txt = sh_txt.replace("--enable-alsa", "--disable-alsa")
              with open(cfg_sh, "w") as f:
                  f.write(sh_txt)
              print("Patched scripts/configure_engines.sh!")

          # 3F. Inject Cortex-A9 optimization flags and 32-bit HIGH_DEF=1 into backends/platform/libretro/Makefile
          mk_file = "backends/platform/libretro/Makefile"
          with open(mk_file, "r") as f:
              mk = f.read()

          opt_flags = "-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG -fPIC"

          inject_block = f"""
          TARGET_64BIT := 0
          HIGH_DEF := 1
          OPENGL_SUPPORT := 0
          HAVE_NEON := 0
          CFLAGS += {opt_flags}
          CXXFLAGS += {opt_flags}
          LDFLAGS += -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc -lpthread -lm -ldl
          """
          assert "Makefile.common" in mk, "Makefile.common include not found"
          mk = mk.replace("include $(ROOT_PATH)/Makefile.common", inject_block + "\ninclude $(ROOT_PATH)/Makefile.common")
          mk = mk.replace("include Makefile.common", inject_block + "\ninclude Makefile.common")
          with open(mk_file, "w") as f:
              f.write(mk)
          print("Injected Cortex-A9 flags + 32-bit HIGH_DEF=1 into backends/platform/libretro/Makefile!")
          PYEOF

            # 4. Export cross-compiler tools
            export CC="arm-linux-gnueabi-gcc"
            export CXX="arm-linux-gnueabi-g++"
            export AR="arm-linux-gnueabi-ar"
            export AS="arm-linux-gnueabi-as"
            export LD="arm-linux-gnueabi-g++"
            export STRIP="arm-linux-gnueabi-strip"

            cd backends/platform/libretro

            # 5. Build scummvm_libretro.so and auxiliary datafiles (scummvm.zip + scummvm_libretro.info)
            #    IMPORTANT: Do NOT pass USE_*=0 on the make CLI so `override undefine` in Makefile.common works cleanly!
            make \
              platform=unix \
              ARCH=arm \
              TARGET_64BIT=0 \
              HIGH_DEF=1 \
              CC="$CC" \
              CXX="$CXX" \
              AR="$AR" \
              LD="$LD" \
              LITE=1 \
              NO_WIP=1 \
              OPENGL_SUPPORT=0 \
              HAVE_NEON=0 \
              -j$(nproc) all 2>&1 | tee /work/build_scummvm.log

            $STRIP -s scummvm_libretro.so

            cp scummvm_libretro.so /work/scummvm_libretro.so
            if [ -f scummvm.zip ]; then cp scummvm.zip /work/scummvm.zip; fi
            if [ -f scummvm_libretro.info ]; then cp scummvm_libretro.info /work/scummvm_libretro.info; fi

            echo "=== BUILD REPORT ===" > /work/build_report.txt
            ls -lh /work/scummvm_libretro.so >> /work/build_report.txt
            arm-linux-gnueabi-readelf -d /work/scummvm_libretro.so | grep NEEDED >> /work/build_report.txt
          '
          ls -lh scummvm_libretro.so build_scummvm.log build_report.txt

      - name: Upload ScummVM Libretro Core + Datafiles + Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_libretro_leapster
          path: |
            scummvm_libretro.so
            scummvm.zip
            scummvm_libretro.info
            build_scummvm.log
            build_report.txt
