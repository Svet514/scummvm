name: Build ScummVM Libretro Core (Leapster Cortex-A9 Optimized)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Compile ScummVM Libretro Core Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -c '
            set -e
            set -o pipefail

            # 1. Install ARMv7 softfp cross-compiler, git (required by configure_submodules.sh), and build tools
            apt-get update
            apt-get install -y \
              git \
              ca-certificates \
              pkg-config \
              gcc-arm-linux-gnueabi \
              g++-arm-linux-gnueabi \
              binutils-arm-linux-gnueabi \
              make \
              wget \
              tar \
              zip \
              unzip \
              sed \
              gawk \
              python3

            # 2. Clone official ScummVM v2026.4.0 with .git metadata intact for Libretro scripts
            rm -rf scummvm-2026.4.0
            git clone --depth 1 --branch v2026.4.0 https://github.com/scummvm/scummvm.git scummvm-2026.4.0
            cd scummvm-2026.4.0

            # 3. Configure strictly for SCUMM engine, disable OpenGL & host x86_64 shared libs, and inject Cortex-A9 flags
            python3 - << "PYEOF"
          import os
          import re

          # 3A. Write ONLY scumm (+ v7/v8 and HE sub-engines) to lite_engines.list and engines.lite
          lite_content = "scumm\nscumm_7_8\nhe\n"
          for list_name in ["lite_engines.list", "engines.lite"]:
              p = os.path.join("backends/platform/libretro", list_name)
              with open(p, "w") as f:
                  f.write(lite_content)

          # 3B. Also strip non-SCUMM engines directly in engines/engines.mk so only SCUMM can ever be enabled
          eng_mk = "engines/engines.mk"
          if os.path.exists(eng_mk):
              with open(eng_mk, "r") as f:
                  emk = f.read()
              # Comment out any default ENABLE_<ENGINE> = STATIC_PLUGIN except SCUMM, SCUMM_7_8, HE
              def filter_engine(match):
                  eng = match.group(1)
                  if eng in ("SCUMM", "SCUMM_7_8", "HE"):
                      return match.group(0)
                  return f"# {match.group(0)}"
              emk = re.sub(r"^(\s*ENABLE_([A-Z0-9_]+)\s*=\s*STATIC_PLUGIN)", lambda m: m.group(0) if m.group(2) in ("SCUMM", "SCUMM_7_8", "HE") else "# " + m.group(0), emk, flags=re.M)
              with open(eng_mk, "w") as f:
                  f.write(emk)
              print("Restricted engines/engines.mk to SCUMM only!")

          # 3C. Patch backends/platform/libretro/dependencies.mk to never link host x86_64 shared libraries
          dep_mk = "backends/platform/libretro/dependencies.mk"
          if os.path.exists(dep_mk):
              with open(dep_mk, "r") as f:
                  dmk = f.read()
              # Force sharedlib_test.mk checks off when cross-compiling for ARM
              dmk = re.sub(r"SHARED_([A-Z0-9_]+)\s*:?=\s*1", r"SHARED_\1 := 0", dmk)
              with open(dep_mk, "w") as f:
                  f.write(dmk)
              print("Disabled host shared library probing in dependencies.mk!")

          # 3D. Patch backends/platform/libretro/Makefile.common (disable HIGH_DEF & OpenGL)
          mk_common = "backends/platform/libretro/Makefile.common"
          with open(mk_common, "r") as f:
              mc = f.read()
          mc = mc.replace("HIGH_DEF := 1", "HIGH_DEF := 0")
          mc = mc.replace("OPENGL_SUPPORT := 1", "OPENGL_SUPPORT := 0")
          mc = mc.replace("USE_OPENGL := 1", "USE_OPENGL := 0")
          with open(mk_common, "w") as f:
              f.write(mc)

          # 3E. Patch backends/platform/libretro/Makefile:
          #     - Force OPENGL_SUPPORT := 0 and TARGET_64BIT := 0
          #     - Inject Cortex-A9 OPT_FLAGS and static libstdc++/libgcc
          mk_file = "backends/platform/libretro/Makefile"
          with open(mk_file, "r") as f:
              mk = f.read()
          mk = mk.replace("OPENGL_SUPPORT := 1", "OPENGL_SUPPORT := 0")
          mk = mk.replace("OPENGL_SUPPORT = 1", "OPENGL_SUPPORT = 0")

          opt_flags = "-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG -fPIC"

          inject_block = f"""
          TARGET_64BIT := 0
          OPENGL_SUPPORT := 0
          USE_OPENGL := 0
          HAVE_OPENGL := 0
          HAVE_NEON := 0
          CFLAGS += {opt_flags}
          CXXFLAGS += {opt_flags}
          LDFLAGS += -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc -lpthread -lm -ldl
          """
          # Insert right before include Makefile.common
          assert "include Makefile.common" in mk or "Makefile.common" in mk, "Makefile.common include not found"
          mk = mk.replace("include $(ROOT_PATH)/Makefile.common", inject_block + "\ninclude $(ROOT_PATH)/Makefile.common")
          mk = mk.replace("include Makefile.common", inject_block + "\ninclude Makefile.common")
          with open(mk_file, "w") as f:
              f.write(mk)
          print("Patched backends/platform/libretro/Makefile and Makefile.common!")
          PYEOF

            # 4. Export cross-compiler tools (do not pass CFLAGS on make CLI so internal Makefile += rules work)
            export CC="arm-linux-gnueabi-gcc"
            export CXX="arm-linux-gnueabi-g++"
            export AR="arm-linux-gnueabi-ar"
            export AS="arm-linux-gnueabi-as"
            export LD="arm-linux-gnueabi-g++"
            export STRIP="arm-linux-gnueabi-strip"

            cd backends/platform/libretro

            # 5. Step 1: Pre-configure submodules and engines first so any script output is clearly visible
            make \
              platform=unix \
              ARCH=arm \
              TARGET_64BIT=0 \
              CC="$CC" \
              CXX="$CXX" \
              AR="$AR" \
              LD="$LD" \
              LITE=1 \
              LITE_BUILD=1 \
              NO_WIP=1 \
              OPENGL_SUPPORT=0 \
              USE_OPENGL=0 \
              HAVE_OPENGL=0 \
              USE_MT32EMU=0 \
              USE_FLUIDSYNTH=0 \
              USE_FLAC=0 \
              USE_VORBIS=0 \
              USE_TREMOR=0 \
              USE_MAD=0 \
              USE_FAAD=0 \
              USE_MPEG2=0 \
              USE_THEORADEC=0 \
              USE_FREETYPE2=0 \
              USE_PNG=1 \
              USE_ZLIB=1 \
              USE_CLOUD=0 \
              USE_LIBCURL=0 \
              USE_FRIBIDI=0 \
              HAVE_NEON=0 \
              -j$(nproc) all 2>&1 | tee /work/build_scummvm.log

            $STRIP -s scummvm_libretro.so

            cp scummvm_libretro.so /work/scummvm_libretro.so
            if [ -f scummvm.zip ]; then cp scummvm.zip /work/scummvm.zip; fi
            if [ -f scummvm_libretro.info ]; then cp scummvm_libretro.info /work/scummvm_libretro.info; fi

            echo "=== BUILD REPORT ===" > /work/build_report.txt
            ls -lh /work/scummvm_libretro.so >> /work/build_report.txt
            arm-linux-gnueabi-readelf -d /work/scummvm_libretro.so | grep NEEDED >> /work/build_report.txt
          '
          ls -lh scummvm_libretro.so build_scummvm.log build_report.txt

      - name: Upload ScummVM Libretro Core + Datafiles + Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_libretro_leapster
          path: |
            scummvm_libretro.so
            scummvm.zip
            scummvm_libretro.info
            build_scummvm.log
            build_report.txt
