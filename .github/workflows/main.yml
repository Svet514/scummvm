name: Build ScummVM Leapster

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ScummVM Inside Debian Buster Container (Cortex-A9 Optimized)
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:buster bash -c '
            set -e
            set -o pipefail
            
            # 1. Add ARM architecture, install toolchain and dependencies
            dpkg --add-architecture armel
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make wget tar pkg-config libsdl1.2-dev:armel
            
            # 2. Download and extract target release
            wget https://github.com/scummvm/scummvm/archive/refs/tags/v2026.4.0.tar.gz -O scummvm.tar.gz
            tar -xzf scummvm.tar.gz
            cd scummvm-2026.4.0
            
            # 3. Setup strict hardware optimization flags
            OPT_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            
            export CC="arm-linux-gnueabi-gcc"
            export CXX="arm-linux-gnueabi-g++"
            export AS="arm-linux-gnueabi-as"
            export STRIP="arm-linux-gnueabi-strip"
            
            export CFLAGS="$OPT_FLAGS -DHAVE_NEON=0"
            export CXXFLAGS="$OPT_FLAGS -DHAVE_NEON=0 -static-libstdc++ -static-libgcc"
            export LDFLAGS="$OPT_FLAGS -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc"
            
            # 4. Configure for minimal Scumm engine footprint (with OpenGL disabled)
            ./configure \
              --host=arm-linux-gnueabi \
              --backend=sdl \
              --disable-opengl \
              --disable-all-engines \
              --enable-engine=scumm \
              --disable-debug \
              --disable-cloud \
              --disable-libcurl \
              --disable-discord \
              --disable-updates \
              --disable-tts \
              --disable-bink \
              --enable-release
            
            # 5. Build, strip, and export
            make -j$(nproc) 2>&1 | tee ../build_scummvm.log
            $STRIP -s scummvm
            
            cp scummvm ../scummvm_leapster
            ls -lh ../scummvm_leapster >> ../build_report.txt
          '
          ls -lh scummvm_leapster build_scummvm.log build_report.txt

      - name: Upload ScummVM Binary + Build Log + Diff Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_leapster_gs_binary
          path: |
            scummvm_leapster
            build_scummvm.log
            build_report.txt
