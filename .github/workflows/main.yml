          static void leap_pre(void) { leap_touch(); g_pre_u = leap_us(); }
          static void leap_post(void) {
              uint64_t u = leap_us(); if (g_pre_u && u > g_pre_u) g_emu_u += (u - g_pre_u);
              if (!g_win) { leap_open_log(); g_win = u; }
              g_total_runs++; g_runs++;
              if (u - g_win >= 1000000ULL) {
                  g_sec++;
                  uint32_t wm = (uint32_t)((u - g_win) / 1000ULL), em = (uint32_t)(g_emu_u / 1000ULL), bm = (uint32_t)(g_blk_u / 1000ULL);
                  uint32_t mm = (g_mf * 1000U) / 44100U, am = (g_af * 1000U) / 41155U;
                  if (g_tfp && g_sec <= 600) { fprintf(g_tfp, "%3u | %4u | %6u | %5u | %5u | %6u | %6u | %5u | %7u | %6u | %6u | (%d,%d,%d,%u)\n", g_sec, wm, em, g_runs, g_uscr, mm, am, g_mb, bm, g_dc, g_dw, g_lsx < 0 ? 160 : g_lsx, g_lsy < 0 ? 120 : g_lsy, (int)g_rp_out, g_clicks); fflush(g_tfp); }
                  g_win = u; g_runs = g_uscr = g_dc = g_dw = g_mf = g_af = g_mb = g_clicks = 0; g_emu_u = g_blk_u = 0;
              }
          }
          """
          pos = min(re.search(fn, ct).start() for fn in [r"void\s+retro_set_environment\b", r"static\s+void\s+audio_buffer_init\b", r"static\s+void\s+audio_run\b", r"void\s+retro_set_input_state\b", r"void\s+retro_set_audio_sample_batch\s*\(", r"void\s+retro_set_video_refresh\b", r"void\s+retro_run\b"])
          ct = ct[:pos] + hook + "\n" + ct[pos:]
          ct, n_env = re.subn(r"(void\s+retro_set_environment\s*\(\s*retro_environment_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_env = \2; \2 = leap_env_cb;", ct, count=1)
          ct, n_in  = re.subn(r"(void\s+retro_set_input_state\s*\(\s*retro_input_state_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_in = \2; \2 = leap_in_cb;", ct, count=1)
          ct, n_aud = re.subn(r"(void\s+retro_set_audio_sample_batch\s*\(\s*retro_audio_sample_batch_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_aud = \2; \2 = leap_aud_cb;", ct, count=1)
          ct, n_vid = re.subn(r"(void\s+retro_set_video_refresh\s*\(\s*retro_video_refresh_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_vid = \2; \2 = leap_vid_cb;", ct, count=1)
          assert n_env == 1 and n_in == 1 and n_aud == 1 and n_vid == 1
          mr = re.search(r"void\s+retro_run\s*\(\s*(?:void)?\s*\)\s*\{", ct)
          bs, dp, be = mr.end() - 1, 0, -1
          for i in range(bs, len(ct)):
              dp += (ct[i] == "{") - (ct[i] == "}")
              if dp == 0: be = i; break
          open(cp, "w").write(ct[:bs + 1] + "\n\tleap_pre();\n" + ct[bs + 1:be] + "\n\tleap_post();\n" + ct[be:])
          # 8. V48 ARMv7 flags + static Tremor integer Ogg Vorbis enabled
          mkf = "backends/platform/libretro/Makefile"
          mk = open(mkf, "r").read()
          opt = "-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -munaligned-access -fsigned-char -O3 -fomit-frame-pointer -fno-strict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG -DPNG_ARM_NEON_OPT=0 -DUSE_BINK=1 -DUSE_TREMOR=1 -DUSE_VORBIS=1 -DUSE_OGG=1 -fPIC"
          ldf = "-Wl,-Bsymbolic -Wl,-Bsymbolic-functions -Wl,--wrap=expf -Wl,--wrap=exp2f -Wl,--wrap=logf -Wl,--wrap=log2f -Wl,--wrap=powf -static-libstdc++ -static-libgcc -lpthread -lm -ldl"
          inj = f"\nTARGET_64BIT := 0\nHIGH_DEF := 1\nUSE_BINK := 1\nUSE_TREMOR := 1\nUSE_OGG := 1\nUSE_VORBIS := 0\nOPENGL_SUPPORT := 0\nUSE_OPENGL := 0\nHAVE_OPENGL := 0\nUSE_IMGUI := 0\nUSE_CURL := 0\nUSE_LIBCURL := 0\nUSE_CLOUD := 0\nUSE_BASIC_NET := 0\nUSE_SDL_NET := 0\nUSE_ALSA := 0\nHAVE_NEON := 0\nCFLAGS += {opt}\nCXXFLAGS += {opt}\nLDFLAGS += {ldf}\n"
          open(mkf, "w").write(mk.replace("include $(ROOT_PATH)/Makefile.common", inj + "\ninclude $(ROOT_PATH)/Makefile.common").replace("include Makefile.common", inj + "\ninclude Makefile.common"))
          EOF
      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work/scummvm-2026.4.0/backends/platform/libretro ubuntu:18.04 bash -c '
            set -e -o pipefail
            apt-get update && apt-get install -y git ca-certificates pkg-config gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi make zip unzip sed gawk
            export CC=arm-linux-gnueabi-gcc CXX=arm-linux-gnueabi-g++ AR="arm-linux-gnueabi-ar cru" RANLIB=arm-linux-gnueabi-ranlib AS=arm-linux-gnueabi-as LD=arm-linux-gnueabi-g++ STRIP=arm-linux-gnueabi-strip
            make platform=unix ARCH=arm TARGET_64BIT=0 HIGH_DEF=1 USE_BINK=1 USE_TREMOR=1 USE_OGG=1 USE_VORBIS=0 CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" LD="$LD" LITE=1 NO_WIP=0 OPENGL_SUPPORT=0 USE_OPENGL=0 HAVE_OPENGL=0 USE_IMGUI=0 USE_CURL=0 USE_LIBCURL=0 USE_CLOUD=0 USE_BASIC_NET=0 USE_SDL_NET=0 USE_ALSA=0 USE_SEQ_MIDI=0 USE_SNDIO=0 USE_TIMIDITY=0 USE_MT32EMU=0 USE_FLUIDSYNTH=0 USE_FLAC=0 USE_MAD=0 USE_FAAD=0 USE_MPEG2=0 USE_THEORADEC=0 USE_FREETYPE2=0 USE_FRIBIDI=0 USE_PNG=1 USE_ZLIB=1 USE_JPEG=1 HAVE_NEON=0 -j$(nproc) all 2>&1 | tee /work/build_scummvm.log
            echo "=== GLIBC VERSIONS ===" > /work/build_report.txt
            arm-linux-gnueabi-objdump -T scummvm_libretro.so | grep -o "GLIBC_[0-9.]*" | sort -uV >> /work/build_report.txt || true
            $STRIP -s scummvm_libretro.so
            echo "=== BINARY SIZE ===" >> /work/build_report.txt
            ls -lh scummvm_libretro.so >> /work/build_report.txt
            cp scummvm_libretro.so /work/scummvm_libretro.so
          '
      - name: Upload ScummVM Libretro Core V52
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_libretro_leapster_v52
          path: |
            scummvm_libretro.so
            build_scummvm.log
            build_report.txt
