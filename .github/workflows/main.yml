          public:
          \tLeapRateMatchStream(AudioStream *src, int dstRate, bool dstStereo)
          \t\t: _src(src),
          \t\t  _srcRate((src && src->getRate() > 0) ? src->getRate() : (dstRate > 0 ? dstRate : 11025)),
          \t\t  _dstRate(dstRate > 0 ? dstRate : 11025),
          \t\t  _srcStereo(src ? src->isStereo() : false),
          \t\t  _dstStereo(dstStereo),
          \t\t  _posFp(0), _prevL(0), _prevR(0), _curL(0), _curR(0),
          \t\t  _primed(false), _eof(false), _inFrames(0), _inIdx(0) {
          \t\t_stepFp = (uint32)(((uint64)(uint32)_srcRate << 16) / (uint32)_dstRate);
          \t\tif (_stepFp == 0) _stepFp = 65536U;
          \t}
          \t~LeapRateMatchStream() override { delete _src; }
          \tbool isStereo() const override { return _dstStereo; }
          \tint getRate() const override { return _dstRate; }
          \tbool endOfData() const override { return _eof && (_posFp >= 65536U || !_primed); }
          \tbool endOfStream() const override { return _eof && (_posFp >= 65536U || !_primed); }

          \tint readBuffer(int16 *buffer, const int numSamples) override {
          \t\tif (!_src || numSamples <= 0)
          \t\t\treturn 0;
          \t\tif (!_primed) {
          \t\t\tif (!pullNextSrcFrame())
          \t\t\t\treturn 0;
          \t\t\t_prevL = _curL;
          \t\t\t_prevR = _curR;
          \t\t\t_primed = true;
          \t\t\t_posFp = 65536U;
          \t\t}
          \t\tint maxFrames = _dstStereo ? (numSamples / 2) : numSamples;
          \t\tint outFrames = 0;
          \t\twhile (outFrames < maxFrames) {
          \t\t\twhile (_posFp >= 65536U) {
          \t\t\t\tif (!pullNextSrcFrame())
          \t\t\t\t\treturn _dstStereo ? (outFrames * 2) : outFrames;
          \t\t\t\t_posFp -= 65536U;
          \t\t\t}
          \t\t\tint32 frac = (int32)(_posFp & 0xFFFFU);
          \t\t\tint16 outL = (int16)(_prevL + (((_curL - _prevL) * frac) >> 16));
          \t\t\tif (_dstStereo) {
          \t\t\t\tint16 outR = (int16)(_prevR + (((_curR - _prevR) * frac) >> 16));
          \t\t\t\tbuffer[outFrames * 2] = outL;
          \t\t\t\tbuffer[outFrames * 2 + 1] = outR;
          \t\t\t} else {
          \t\t\t\tbuffer[outFrames] = outL;
          \t\t\t}
          \t\t\toutFrames++;
          \t\t\t_posFp += _stepFp;
          \t\t}
          \t\treturn _dstStereo ? (outFrames * 2) : outFrames;
          \t}
          };

