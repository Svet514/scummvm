name: Build ScummVM Libretro Core V13 (Clean Base + 8K Audio Buf + Bink)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone & Patch ScummVM v2026.4.0
        run: |
          rm -rf scummvm-2026.4.0
          git clone --depth 1 --branch v2026.4.0 https://github.com/scummvm/scummvm.git scummvm-2026.4.0
          cd scummvm-2026.4.0

          python3 - << 'EOF'
          import os, re

          # 1. Enable scumm, scumm_7_8, he, and mediastation
          for name in ["lite_engines.list", "engines.lite"]:
              open(os.path.join("backends/platform/libretro", name), "w").write("scumm\nscumm_7_8\nhe\nmediastation\n")
          ms_cfg = "engines/mediastation/configure.engine"
          if os.path.exists(ms_cfg):
              open(ms_cfg, "w").write(re.sub(r'\badd_engine\s+mediastation\s+"([^"]+)"\s+\w+', r'add_engine mediastation "\1" yes', open(ms_cfg).read()))

          with open("../upstream_inspect.txt", "w") as df:
              for p in ["backends/platform/libretro/include/libretro-defs.h", "backends/platform/libretro/src/libretro-core.cpp", "backends/platform/libretro/src/libretro-os-base.cpp", "backends/platform/libretro/src/libretro-os-utils.cpp", "engines/mediastation/actors/sound.cpp"]:
                  if os.path.exists(p): df.write(f"\n=== {p} ===\n" + open(p, errors="ignore").read())

          # 2. Generic detection unlock + auto-accept unsupported game dialog (V7/V8)
          adv = "engines/advancedDetector.cpp"
          at = open(adv, errors="ignore").read()
          at = re.sub(r"\breturn\s+matched\s*;", "{ for (uint _i = 0; _i < matched.size(); ++_i) matched[_i].hasUnknownFiles = false; return matched; }", at)
          at = re.sub(r"(\bhasUnknownFiles\s*=\s*)adGame\.hasUnknownFiles\b", r"\1false", at)
          at = re.sub(r"(bool\s+cleanupPirated\s*\([^)]*\)\s*\{)", r"\1 return false;", at)
          open(adv, "w").write(at)

          for sdir in ["engines", "gui", "base"]:
              for root, _, files in os.walk(sdir):
                  for fn in files:
                      if not fn.endswith((".cpp", ".h")): continue
                      fp = os.path.join(root, fn)
                      t = open(fp, errors="ignore").read()
                      nt = re.sub(r"(bool\s+(?:[A-Za-z0-9_]+::)?warnUserAboutUnsupportedGame\s*\([^)]*\)\s*\{)", r"\1 return true;", t)
                      if fn == "launcher.cpp": nt = re.sub(r"\b(\w+(?:\[\w+\])?)\.hasUnknownFiles\b", "false", nt)
                      if "detection" in fn: nt = re.sub(r"\bADGF_(?:UNSTABLE|TESTING)\b", "0", nt)
                      if nt != t: open(fp, "w").write(nt)

          # 3. Disable unused libs while explicitly enabling Bink in configure + Makefiles (fixes Steve black!)
          for mk in ["backends/imgui/module.mk", "backends/networking/basic/module.mk", "backends/networking/curl/module.mk", "backends/networking/http/module.mk", "backends/networking/sdl_net/module.mk", "backends/cloud/module.mk"]:
              if os.path.exists(mk): open(mk, "w").write("# Disabled\n")
          if os.path.exists("configure"):
              cfg = open("configure", errors="ignore").read()
              cfg = re.sub(r"^\s*add_component\s+imgui\b.*$", "# disabled imgui", cfg, flags=re.M)
              cfg = re.sub(r"^_bink=.*$", "_bink=yes", cfg, flags=re.M)
              open("configure", "w").write(cfg)

          dis = ["USE_IMGUI", "USE_CURL", "USE_LIBCURL", "USE_CLOUD", "USE_BASIC_NET", "USE_SDL_NET", "USE_ALSA", "USE_SEQ_MIDI", "USE_SNDIO", "USE_TIMIDITY", "USE_FLUIDSYNTH", "USE_MT32EMU", "USE_FREETYPE2", "USE_FRIBIDI", "USE_MPEG2", "USE_THEORADEC", "USE_VPX", "USE_FAAD", "USE_AAC", "USE_VORBIS", "USE_TREMOR", "USE_FLAC", "USE_MAD", "USE_OGG", "USE_MPCDEC", "USE_OPENMPT", "USE_MIKMOD", "USE_TTS", "USE_DISCORD", "USE_RETROACHIEVEMENTS", "USE_GTK", "USE_SYSDIALOGS", "USE_UNITY", "OPENGL_SUPPORT", "USE_OPENGL", "HAVE_OPENGL"]
          for mr in ["backends/platform/libretro/Makefile", "backends/platform/libretro/Makefile.common", "backends/platform/libretro/dependencies.mk"]:
              if os.path.exists(mr):
                  t = re.sub(r"SHARED_([A-Z0-9_]+)\s*:?=\s*1", r"SHARED_\1 := 0", open(mr).read())
                  for v in dis: t = re.sub(rf"\b{v}\s*[:?]?=\s*1\b", f"{v} := 0", t)
                  t = re.sub(r"\bUSE_BINK\s*[:?]?=\s*0\b", "USE_BINK := 1", t)
                  open(mr, "w").write(t)

          vp = "|".join(dis)
          id_re, in_re = re.compile(rf"^(\s*)ifdef\s+({vp})\s*$", flags=re.M), re.compile(rf"^(\s*)ifndef\s+({vp})\s*$", flags=re.M)
          for root, _, files in os.walk("."):
              for fn in files:
                  if fn.endswith(".mk") or fn in ("Makefile", "Makefile.common"):
                      fp = os.path.join(root, fn)
                      mt = open(fp, errors="ignore").read()
                      nm = in_re.sub(r"\1ifneq ($(\2), 1)", id_re.sub(r"\1ifeq ($(\2), 1)", mt))
                      if nm != mt: open(fp, "w").write(nm)

          csh = "backends/platform/libretro/scripts/configure_engines.sh"
          if os.path.exists(csh):
              st = open(csh).read().replace("--disable-bink", "--enable-bink")
              for fl in ["libcurl", "cloud", "basic-net", "alsa"]: st = st.replace(f"--enable-{fl}", f"--disable-{fl}")
              st = re.sub(r"(/configure\b)", r"\1 --enable-bink", st, count=1)
              open(csh, "w").write(st)

          # 4. Force RETRO_DEVICE_POINTER + quadruple 2048-frame Libretro audio mix ceiling -> 8192
          for root, _, files in os.walk("backends/platform/libretro"):
              for fn in files:
                  if not fn.endswith((".cpp", ".h")): continue
                  fp = os.path.join(root, fn)
                  st = open(fp, errors="ignore").read()
                  ns = re.sub(r"(int\s+retro_setting_get_pointer_device\s*\(\s*(?:void)?\s*\)\s*\{)", r"\1 return RETRO_DEVICE_POINTER;", st)
                  ns = re.sub(r"(bool\s+retro_setting_get_timing_inaccuracies_enabled\s*\(\s*(?:void)?\s*\)\s*\{)", r"\1 return false;", ns)
                  ns = re.sub(r"^(\s*#define\s+\w*(?:AUDIO|SOUND|SAMPLE|BUFF)\w*\s+)2048\b", r"\g<1>8192", ns, flags=re.M)
                  ns = re.sub(r"^(\s*#define\s+\w*(?:AUDIO|SOUND|SAMPLE|BUFF)\w*\s+\(?\s*)2(\s*\*\s*\w+)", r"\g<1>8\g<2>", ns, flags=re.M)
                  m_mix = re.search(r"mixCallback\s*\(", ns)
                  if m_mix:
                      w0, w1 = max(0, m_mix.start() - 900), min(len(ns), m_mix.end() + 900)
                      win = re.sub(r"\b(2048|4096|8192)\b", lambda m: str(int(m.group(1)) * 4), ns[w0:w1])
                      win = re.sub(r"\b2(\s*\*\s*AUDIO_BATCH)", r"8\1", win)
                      ns = ns[:w0] + win + ns[w1:]
                  if ns != st: open(fp, "w").write(ns)

          # 5. Clean V5/V7 getMillis, delayMillis, and updateScreen
          ext = 'extern "C" { unsigned int leapster_hw_get_millis(void); void leapster_sleep_us(unsigned int us); void leapster_telem_delay(unsigned int r, unsigned int a); void leapster_telem_update_screen(void); }\n'
          for root, _, files in os.walk("backends/platform/libretro/src"):
              for fn in files:
                  if not fn.endswith(".cpp"): continue
                  fp = os.path.join(root, fn)
                  t, mod = open(fp, errors="ignore").read(), False
                  if "OSystem_libretro::getMillis" in t:
                      t, n = re.subn(r"(uint32\s+OSystem_libretro::getMillis\s*\([^)]*\)\s*\{)", r"\1 return (uint32)leapster_hw_get_millis();", t, count=1); mod |= (n > 0)
                  if "::updateScreen" in t:
                      t, n = re.subn(r"(void\s+[A-Za-z0-9_]+::updateScreen\s*\([^)]*\)\s*\{)", r"\1 leapster_telem_update_screen();", t, count=1); mod |= (n > 0)
                  md = re.search(r"void\s+OSystem_libretro::delayMillis\s*\(\s*uint\s+(\w+)\s*\)\s*\{", t)
                  if md:
                      p, si, bi, dp, ei = md.group(1), md.start(), md.end() - 1, 0, -1
                      for i in range(bi, len(t)):
                          dp += (t[i] == "{") - (t[i] == "}")
                          if dp == 0: ei = i + 1; break
                      mc = re.search(r"\(\(LibretroTimerManager\s*\*\)\s*_timerManager\)->checkThread\([^)]*\)", t[bi:ei])
                      chk = mc.group(0) if mc else "((LibretroTimerManager *)_timerManager)->checkThread(THREAD_SWITCH_DELAY)"
                      nfn = f"void OSystem_libretro::delayMillis(uint {p}) {{\n\tuint32 st = getMillis(), el = 0;\n\tif ({p} == 0) {{ {chk}; return; }}\n\twhile (el < {p}) {{ if (!{chk}) leapster_sleep_us(500); el = getMillis() - st; }}\n\tleapster_telem_delay({p}, el);\n}}"
                      t, mod = t[:si] + nfn + t[ei:], True
                  if mod: open(fp, "w").write(ext + t)

          # 6. Patch libretro-core.cpp: Touch + 240p Downscale (NULL dupe frame safe) + V13 Telemetry
          cp = "backends/platform/libretro/src/libretro-core.cpp"
          ct = open(cp).read()
          hook = r"""
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <time.h>
          #include <linux/input.h>
          #include <sys/ioctl.h>
          #ifdef USE_BINK
          #define LEAP_BINK 1
          #else
          #define LEAP_BINK 0
          #endif
          static retro_input_state_t g_orig_in = NULL;
          static retro_audio_sample_batch_t g_orig_aud = NULL;
          static retro_video_refresh_t g_orig_vid = NULL;
          static int g_ts_fd = -2, g_pcal_on = 0, g_click = 0, g_dbpp = 0;
          static char g_ts_nm[64] = "none";
          static int g_cx = 160, g_cy = 120, g_rx = 160, g_ry = 120, g_tch = 0, g_lsx = 160, g_lsy = 120;
          static int g_mnx = 0, g_mxx = 319, g_mny = 0, g_mxy = 239;
          static long g_pcal[7] = {1, 0, 0, 0, 1, 0, 1};
          static bool g_ever = false;
          static int16_t g_rx_out = 0, g_ry_out = 0, g_rp_out = 0;
          static FILE *g_tfp = NULL;
          static uint64_t g_t0 = 0, g_win = 0, g_pre_u = 0, g_post_u = 0, g_emu_u = 0, g_ret_u = 0;
          static uint32_t g_runs = 0, g_uscr = 0, g_dc = 0, g_dr = 0, g_dw = 0, g_af = 0, g_mb = 0, g_sec = 0;
          static unsigned g_vw = 0, g_vh = 0;
          static uint32_t g_d32[320 * 240];
          static uint16_t g_d16[320 * 240];
          static uint64_t leap_us(void) { struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts); return (uint64_t)ts.tv_sec * 1000000ULL + (uint64_t)(ts.tv_nsec / 1000ULL); }
          extern "C" unsigned int leapster_hw_get_millis(void) { uint64_t u = leap_us(); if (!g_t0) g_t0 = u; return (unsigned int)((u - g_t0) / 1000ULL); }
          extern "C" void leapster_sleep_us(unsigned int us) { usleep((useconds_t)us); }
          extern "C" void leapster_telem_delay(unsigned int r, unsigned int a) { g_dc++; g_dr += r; g_dw += a; }
          extern "C" void leapster_telem_update_screen(void) { g_uscr++; }
          static size_t leap_aud_cb(const int16_t *d, size_t f) {
              if (d && f > 0) { g_af += (uint32_t)f; if ((uint32_t)f > g_mb) g_mb = (uint32_t)f; }
              return g_orig_aud ? g_orig_aud(d, f) : f;
          }
          static void leap_vid_cb(const void *d, unsigned w, unsigned h, size_t p) {
              g_vw = w; g_vh = h;
              if (!g_orig_vid) return;
              if (w == 640 && h == 480) {
                  if (d) {
                      if (p >= 2560) {
                          const uint32_t *s = (const uint32_t *)d; size_t st = (p >> 2) << 1; uint32_t *o = g_d32;
                          for (unsigned y = 0; y < 240; ++y, o += 320, s += st) for (unsigned x = 0; x < 320; ++x) o[x] = s[x << 1];
                          g_dbpp = 4; g_orig_vid(g_d32, 320, 240, 1280); return;
                      } else if (p >= 1280) {
                          const uint16_t *s = (const uint16_t *)d; size_t st = (p >> 1) << 1; uint16_t *o = g_d16;
                          for (unsigned y = 0; y < 240; ++y, o += 320, s += st) for (unsigned x = 0; x < 320; ++x) o[x] = s[x << 1];
                          g_dbpp = 2; g_orig_vid(g_d16, 320, 240, 640); return;
                      }
                  } else if (g_dbpp == 4) { g_orig_vid(NULL, 320, 240, 1280); return; }
                  else if (g_dbpp == 2) { g_orig_vid(NULL, 320, 240, 640); return; }
              }
              g_orig_vid(d, w, h, p);
          }
          #define LBPL (sizeof(unsigned long) * 8)
          #define LNB(x) ((((x) - 1) / LBPL) + 1)
          #define LTB(b, a) ((a[(b) / LBPL] >> ((b) % LBPL)) & 1)
          static void leap_touch(void) {
              if (g_ts_fd == -2) {
                  g_ts_fd = -1; FILE *pf = fopen("/etc/pointercal", "r");
                  if (pf) { if (fscanf(pf, "%ld %ld %ld %ld %ld %ld %ld", &g_pcal[0], &g_pcal[1], &g_pcal[2], &g_pcal[3], &g_pcal[4], &g_pcal[5], &g_pcal[6]) == 7 && g_pcal[6]) g_pcal_on = 1; fclose(pf); }
                  for (int i = 0; i < 8; i++) {
                      char dp[32], nm[64] = {0}; snprintf(dp, sizeof(dp), "/dev/input/event%d", i);
                      int fd = open(dp, O_RDONLY | O_NONBLOCK); if (fd < 0) continue;
                      ioctl(fd, EVIOCGNAME(sizeof(nm) - 1), nm);
                      if (strstr(nm, "aclmtr") || strstr(nm, "accel") || strstr(nm, "Accel")) { close(fd); continue; }
                      unsigned long evb[LNB(EV_MAX)] = {0}, abb[LNB(ABS_MAX)] = {0}, kyb[LNB(KEY_MAX)] = {0};
                      if (ioctl(fd, EVIOCGBIT(0, sizeof(evb)), evb) >= 0 && LTB(EV_ABS, evb) && ioctl(fd, EVIOCGBIT(EV_ABS, sizeof(abb)), abb) >= 0 && LTB(ABS_X, abb) && LTB(ABS_Y, abb)) {
                          ioctl(fd, EVIOCGBIT(EV_KEY, sizeof(kyb)), kyb);
                          if (LTB(BTN_TOUCH, kyb) || LTB(BTN_LEFT, kyb) || strstr(nm, "touch") || strstr(nm, "ts")) { g_ts_fd = fd; snprintf(g_ts_nm, sizeof(g_ts_nm), "event%d:%s", i, nm); break; }
                      }
                      close(fd);
                  }
                  if (g_ts_fd >= 0) { struct input_absinfo ax, ay; if (ioctl(g_ts_fd, EVIOCGABS(ABS_X), &ax) >= 0 && ax.maximum > ax.minimum) { g_mnx = ax.minimum; g_mxx = ax.maximum; } if (ioctl(g_ts_fd, EVIOCGABS(ABS_Y), &ay) >= 0 && ay.maximum > ay.minimum) { g_mny = ay.minimum; g_mxy = ay.maximum; } }
              }
              if (g_ts_fd < 0) return;
              struct input_event ev; bool dn = false;
              while (read(g_ts_fd, &ev, sizeof(ev)) == (ssize_t)sizeof(ev)) {
                  if (ev.type == EV_ABS) { if (ev.code == ABS_X) g_cx = ev.value; else if (ev.code == ABS_Y) g_cy = ev.value; else if (ev.code == ABS_PRESSURE) { g_tch = (ev.value > 0); if (g_tch) dn = true; } }
                  else if (ev.type == EV_KEY && (ev.code == BTN_TOUCH || ev.code == BTN_LEFT)) { g_tch = (ev.value != 0); if (g_tch) dn = true; }
                  else if (ev.type == EV_SYN && ev.code == SYN_REPORT && g_tch) { g_rx = g_cx; g_ry = g_cy; g_ever = true; }
              }
              if (g_tch) { g_rx = g_cx; g_ry = g_cy; g_ever = true; }
              if (!g_ever) return;
              int sx = g_pcal_on ? (int)((g_pcal[0] * (long)g_rx + g_pcal[1] * (long)g_ry + g_pcal[2]) / g_pcal[6]) : ((g_mxx > g_mnx) ? ((g_rx - g_mnx) * 320) / (g_mxx - g_mnx) : g_rx);
              int sy = g_pcal_on ? (int)((g_pcal[3] * (long)g_rx + g_pcal[4] * (long)g_ry + g_pcal[5]) / g_pcal[6]) : ((g_mxy > g_mny) ? ((g_ry - g_mny) * 240) / (g_mxy - g_mny) : g_ry);
              sx = sx < 0 ? 0 : (sx > 319 ? 319 : sx); sy = sy < 0 ? 0 : (sy > 239 ? 239 : sy); g_lsx = sx; g_lsy = sy;
              g_rx_out = (int16_t)(((long)sx * 0xffffL) / 320L - 0x7fffL); g_ry_out = (int16_t)(((long)sy * 0xffffL) / 240L - 0x7fffL);
              if (g_click == 0) { g_rp_out = 0; if (g_tch || dn) g_click = 1; } else if (g_click == 1) { g_rp_out = 1; g_click = 2; } else { if (g_tch) g_rp_out = 1; else { g_rp_out = 0; g_click = 0; } }
          }
          static int16_t leap_in_cb(unsigned p, unsigned d, unsigned idx, unsigned id) {
              if ((d & 0xff) == RETRO_DEVICE_POINTER && p == 0 && idx == 0 && g_ever) {
                  if (id == RETRO_DEVICE_ID_POINTER_X) return g_rx_out;
                  if (id == RETRO_DEVICE_ID_POINTER_Y) return g_ry_out;
                  if (id == RETRO_DEVICE_ID_POINTER_PRESSED) return g_rp_out;
              }
              return g_orig_in ? g_orig_in(p, d, idx, id) : 0;
          }
          static void leap_pre(void) { leap_touch(); uint64_t u = leap_us(); if (g_post_u && u > g_post_u) g_ret_u += (u - g_post_u); g_pre_u = u; }
          static void leap_post(void) {
              uint64_t u = leap_us(); if (g_pre_u && u > g_pre_u) g_emu_u += (u - g_pre_u); g_post_u = u;
              if (!g_tfp) {
                  g_tfp = fopen("/roms/scummvm_telemetry.log", "w"); if (!g_tfp) g_tfp = fopen("/tmp/scummvm_telemetry.log", "w");
                  if (g_tfp) { fprintf(g_tfp, "=== ScummVM LeapsterGS V13 ===\nTouch: %s | pcal=%d | bink=%d\nsec | wall | emu_ms | ret_ms | r_fps | u_scr | aud_ms | max_b | res     | d_call | d_wait | touch\n", g_ts_nm, g_pcal_on, LEAP_BINK); fflush(g_tfp); }
                  g_win = u;
              }
              g_runs++;
              if (u - g_win >= 1000000ULL) {
                  g_sec++; uint32_t wm = (uint32_t)((u - g_win) / 1000ULL), em = (uint32_t)(g_emu_u / 1000ULL), rm = (uint32_t)(g_ret_u / 1000ULL), am = (g_af * 1000U) / 44100U;
                  if (g_tfp && g_sec <= 600) { fprintf(g_tfp, "%3u | %4u | %6u | %6u | %5u | %5u | %6u | %5u | %3ux%-3u | %6u | %6u | (%d,%d,%d)\n", g_sec, wm, em, rm, g_runs, g_uscr, am, g_mb, g_vw, g_vh, g_dc, g_dw, g_lsx, g_lsy, (int)g_rp_out); fflush(g_tfp); }
                  g_win = u; g_runs = g_uscr = g_dc = g_dr = g_dw = g_af = g_mb = 0; g_emu_u = g_ret_u = 0;
              }
          }
          """
          pos = min(re.search(fn, ct).start() for fn in [r"void\s+retro_set_input_state\b", r"void\s+retro_set_audio_sample_batch\b", r"void\s+retro_set_video_refresh\b", r"void\s+retro_run\b"])
          ct = ct[:pos] + hook + "\n" + ct[pos:]
          ct = re.sub(r"(void\s+retro_set_input_state\s*\(\s*retro_input_state_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_in = \2; \2 = leap_in_cb;", ct, count=1)
          ct = re.sub(r"(void\s+retro_set_audio_sample_batch\s*\(\s*retro_audio_sample_batch_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_aud = \2; \2 = leap_aud_cb;", ct, count=1)
          ct = re.sub(r"(void\s+retro_set_video_refresh\s*\(\s*retro_video_refresh_t\s+(\w+)\s*\)\s*\{)", r"\1 g_orig_vid = \2; \2 = leap_vid_cb;", ct, count=1)
          mr = re.search(r"void\s+retro_run\s*\(\s*(?:void)?\s*\)\s*\{", ct)
          bs, dp, be = mr.end() - 1, 0, -1
          for i in range(bs, len(ct)):
              dp += (ct[i] == "{") - (ct[i] == "}")
              if dp == 0: be = i; break
          open(cp, "w").write(ct[:bs + 1] + "\n\tleap_pre();\n" + ct[bs + 1:be] + "\n\tleap_post();\n" + ct[be:])

          # 7. Safe Cortex-A9 compiler flags (NO -ffast-math so Bink RDFT/DCT float decode stays accurate!)
          mkf = "backends/platform/libretro/Makefile"
          mk = open(mkf).read()
          opt = "-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -fno-strict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG -DPNG_ARM_NEON_OPT=0 -DUSE_BINK=1 -fPIC"
          inj = f"\nTARGET_64BIT := 0\nHIGH_DEF := 1\nUSE_BINK := 1\nOPENGL_SUPPORT := 0\nUSE_OPENGL := 0\nHAVE_OPENGL := 0\nUSE_IMGUI := 0\nUSE_CURL := 0\nUSE_LIBCURL := 0\nUSE_CLOUD := 0\nUSE_BASIC_NET := 0\nUSE_SDL_NET := 0\nUSE_ALSA := 0\nHAVE_NEON := 0\nCFLAGS += {opt}\nCXXFLAGS += {opt}\nLDFLAGS += -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc -lpthread -lm -ldl\n"
          open(mkf, "w").write(mk.replace("include $(ROOT_PATH)/Makefile.common", inj + "\ninclude $(ROOT_PATH)/Makefile.common").replace("include Makefile.common", inj + "\ninclude Makefile.common"))
          EOF

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work/scummvm-2026.4.0/backends/platform/libretro ubuntu:18.04 bash -c '
            set -e -o pipefail
            apt-get update && apt-get install -y git ca-certificates pkg-config gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi make zip unzip sed gawk
            export CC=arm-linux-gnueabi-gcc CXX=arm-linux-gnueabi-g++ AR="arm-linux-gnueabi-ar cru" RANLIB=arm-linux-gnueabi-ranlib AS=arm-linux-gnueabi-as LD=arm-linux-gnueabi-g++ STRIP=arm-linux-gnueabi-strip
            make platform=unix ARCH=arm TARGET_64BIT=0 HIGH_DEF=1 USE_BINK=1 CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" LD="$LD" LITE=1 NO_WIP=0 OPENGL_SUPPORT=0 USE_OPENGL=0 HAVE_OPENGL=0 USE_IMGUI=0 USE_CURL=0 USE_LIBCURL=0 USE_CLOUD=0 USE_BASIC_NET=0 USE_SDL_NET=0 USE_ALSA=0 USE_SEQ_MIDI=0 USE_SNDIO=0 USE_TIMIDITY=0 USE_MT32EMU=0 USE_FLUIDSYNTH=0 USE_FLAC=0 USE_VORBIS=0 USE_TREMOR=0 USE_MAD=0 USE_FAAD=0 USE_MPEG2=0 USE_THEORADEC=0 USE_FREETYPE2=0 USE_FRIBIDI=0 USE_PNG=1 USE_ZLIB=1 USE_JPEG=1 HAVE_NEON=0 -j$(nproc) all 2>&1 | tee /work/build_scummvm.log
            echo "=== BINK SYMBOLS ===" > /work/build_report.txt
            arm-linux-gnueabi-nm -C scummvm_libretro.so | grep -i BinkDecoder | head -n 10 >> /work/build_report.txt || true
            cat /work/upstream_inspect.txt >> /work/build_report.txt || true
            $STRIP -s scummvm_libretro.so
            cp scummvm_libretro.so /work/scummvm_libretro.so
          '

      - name: Upload ScummVM Libretro Core V13
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_libretro_leapster_v13
          path: |
            scummvm_libretro.so
            build_scummvm.log
            build_report.txt
