name: Build ScummVM Libretro Core V8 (No Warning + Audio Catch-Up + Telemetry)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone & Patch ScummVM v2026.4.0
        run: |
          rm -rf scummvm-2026.4.0
          git clone --depth 1 --branch v2026.4.0 https://github.com/scummvm/scummvm.git scummvm-2026.4.0
          cd scummvm-2026.4.0

          python3 - << 'EOF'
          import os, re

          # 1. Enable scumm, scumm_7_8, he, and mediastation
          lite_content = "scumm\nscumm_7_8\nhe\nmediastation\n"
          for name in ["lite_engines.list", "engines.lite"]:
              with open(os.path.join("backends/platform/libretro", name), "w") as f:
                  f.write(lite_content)

          ms_cfg = "engines/mediastation/configure.engine"
          if os.path.exists(ms_cfg):
              with open(ms_cfg, "r") as f:
                  mtxt = f.read()
              mtxt = re.sub(r'\badd_engine\s+mediastation\s+"([^"]+)"\s+\w+', r'add_engine mediastation "\1" yes', mtxt)
              with open(ms_cfg, "w") as f:
                  f.write(mtxt)

          # 2. GENERIC DETECTION UNLOCK + REMOVE "NOT YET FULLY SUPPORTED" WARNING DIALOG
          adv_cpp = "engines/advancedDetector.cpp"
          with open(adv_cpp, "r", errors="ignore") as f:
              atxt = f.read()
          atxt = re.sub(
              r"\breturn\s+matched\s*;",
              "{ for (uint _i = 0; _i < matched.size(); ++_i) matched[_i].hasUnknownFiles = false; return matched; }",
              atxt
          )
          atxt = re.sub(r"(\bhasUnknownFiles\s*=\s*)adGame\.hasUnknownFiles\b", r"\1false", atxt)
          atxt = re.sub(r"(bool\s+cleanupPirated\s*\([^)]*\)\s*\{)", r"\1 return false;", atxt)
          with open(adv_cpp, "w") as f:
              f.write(atxt)

          for search_dir in ["engines", "gui", "base"]:
              for root, _, files in os.walk(search_dir):
                  for fn in files:
                      if not fn.endswith((".cpp", ".h")):
                          continue
                      fpath = os.path.join(root, fn)
                      with open(fpath, "r", errors="ignore") as f:
                          txt = f.read()
                      new_txt = txt
                      # Auto-accept warnUserAboutUnsupportedGame() without showing dialog
                      new_txt = re.sub(
                          r"(bool\s+(?:[A-Za-z0-9_]+::)?warnUserAboutUnsupportedGame\s*\([^)]*\)\s*\{)",
                          r"\1 return true;",
                          new_txt
                      )
                      # Clear hasUnknownFiles checks in launcher
                      if fn == "launcher.cpp":
                          new_txt = re.sub(r"\b(\w+(?:\[\w+\])?)\.hasUnknownFiles\b", "false", new_txt)
                      # Strip ADGF_UNSTABLE and ADGF_TESTING flags from detection tables
                      if "detection" in fn and ("ADGF_UNSTABLE" in new_txt or "ADGF_TESTING" in new_txt):
                          new_txt = re.sub(r"\bADGF_UNSTABLE\b", "0", new_txt)
                          new_txt = re.sub(r"\bADGF_TESTING\b", "0", new_txt)
                      if new_txt != txt:
                          with open(fpath, "w") as f:
                              f.write(new_txt)
                          print(f"Patched detection/warning in {fpath}")

          # 3. Stub out unused backend modules & remove imgui
          for mod_mk in [
              "backends/imgui/module.mk",
              "backends/networking/basic/module.mk",
              "backends/networking/curl/module.mk",
              "backends/networking/http/module.mk",
              "backends/networking/sdl_net/module.mk",
              "backends/cloud/module.mk"
          ]:
              if os.path.exists(mod_mk):
                  with open(mod_mk, "w") as f:
                      f.write("# Disabled\n")

          if os.path.exists("configure"):
              with open("configure", "r", errors="ignore") as f:
                  cfg = f.read()
              cfg = re.sub(r"^\s*add_component\s+imgui\b.*$", "# disabled imgui", cfg, flags=re.M)
              with open("configure", "w") as f:
                  f.write(cfg)

          # 4. Disable external libraries while keeping HIGH_DEF := 1 (32-bit color)
          disable_vars = [
              "USE_IMGUI", "USE_CURL", "USE_LIBCURL", "USE_CLOUD", "USE_BASIC_NET", "USE_SDL_NET",
              "USE_ALSA", "USE_SEQ_MIDI", "USE_SNDIO", "USE_TIMIDITY", "USE_FLUIDSYNTH",
              "USE_MT32EMU", "USE_FREETYPE2", "USE_FRIBIDI", "USE_MPEG2", "USE_THEORADEC",
              "USE_VPX", "USE_FAAD", "USE_AAC", "USE_VORBIS", "USE_TREMOR", "USE_FLAC", "USE_MAD",
              "USE_OGG", "USE_MPCDEC", "USE_OPENMPT", "USE_MIKMOD", "USE_BINK", "USE_TTS",
              "USE_DISCORD", "USE_RETROACHIEVEMENTS", "USE_GTK", "USE_SYSDIALOGS", "USE_UNITY",
              "OPENGL_SUPPORT", "USE_OPENGL", "HAVE_OPENGL"
          ]
          for mk_rel in [
              "backends/platform/libretro/Makefile",
              "backends/platform/libretro/Makefile.common",
              "backends/platform/libretro/dependencies.mk"
          ]:
              if os.path.exists(mk_rel):
                  with open(mk_rel, "r") as f:
                      txt = f.read()
                  txt = re.sub(r"SHARED_([A-Z0-9_]+)\s*:?=\s*1", r"SHARED_\1 := 0", txt)
                  for v in disable_vars:
                      txt = re.sub(rf"\b{v}\s*[:?]?=\s*1\b", f"{v} := 0", txt)
                  with open(mk_rel, "w") as f:
                      f.write(txt)

          var_pat = "|".join(disable_vars)
          ifdef_re = re.compile(rf"^(\s*)ifdef\s+({var_pat})\s*$", flags=re.M)
          ifndef_re = re.compile(rf"^(\s*)ifndef\s+({var_pat})\s*$", flags=re.M)
          for root, _, files in os.walk("."):
              for fn in files:
                  if fn.endswith(".mk") or fn in ("Makefile", "Makefile.common"):
                      fpath = os.path.join(root, fn)
                      with open(fpath, "r", errors="ignore") as f:
                          mtxt = f.read()
                      new_mtxt = ifdef_re.sub(r"\1ifeq ($(\2), 1)", mtxt)
                      new_mtxt = ifndef_re.sub(r"\1ifneq ($(\2), 1)", new_mtxt)
                      if new_mtxt != mtxt:
                          with open(fpath, "w") as f:
                              f.write(new_mtxt)

          cfg_sh = "backends/platform/libretro/scripts/configure_engines.sh"
          if os.path.exists(cfg_sh):
              with open(cfg_sh, "r") as f:
                  sh_txt = f.read()
              for flag in ["libcurl", "cloud", "basic-net", "alsa"]:
                  sh_txt = sh_txt.replace(f"--enable-{flag}", f"--disable-{flag}")
              with open(cfg_sh, "w") as f:
                  f.write(sh_txt)

          # 5. Force RETRO_DEVICE_POINTER and disable timing_inaccuracies
          for root, _, files in os.walk("backends/platform/libretro"):
              for fn in files:
                  if fn.endswith((".cpp", ".h")):
                      fpath = os.path.join(root, fn)
                      with open(fpath, "r", errors="ignore") as f:
                          stxt = f.read()
                      new_stxt = re.sub(
                          r"(int\s+retro_setting_get_pointer_device\s*\(\s*(?:void)?\s*\)\s*\{)",
                          r"\1\n\treturn RETRO_DEVICE_POINTER;", stxt)
                      new_stxt = re.sub(
                          r"(bool\s+retro_setting_get_timing_inaccuracies_enabled\s*\(\s*(?:void)?\s*\)\s*\{)",
                          r"\1\n\treturn false;", new_stxt)
                      if new_stxt != stxt:
                          with open(fpath, "w") as f:
                              f.write(new_stxt)

          # 6. Patch OSystem_libretro::getMillis, delayMillis, and updateScreen
          extern_decls = r"""
          extern "C" {
              unsigned int leapster_hw_get_millis(void);
              void leapster_sleep_us(unsigned int us);
              void leapster_telem_delay(unsigned int req_ms, unsigned int actual_ms);
              void leapster_telem_update_screen(void);
          }
          """
          for root, _, files in os.walk("backends/platform/libretro/src"):
              for fn in files:
                  if not fn.endswith(".cpp"):
                      continue
                  fpath = os.path.join(root, fn)
                  with open(fpath, "r", errors="ignore") as f:
                      txt = f.read()
                  mod = False
                  if "OSystem_libretro::getMillis" in txt:
                      txt, n = re.subn(
                          r"(uint32\s+OSystem_libretro::getMillis\s*\([^)]*\)\s*\{)",
                          r"\1\n\treturn (uint32)leapster_hw_get_millis();", txt, count=1)
                      mod = mod or (n > 0)
                  if "::updateScreen" in txt:
                      txt, n = re.subn(
                          r"(void\s+[A-Za-z0-9_]+::updateScreen\s*\([^)]*\)\s*\{)",
                          r"\1\n\tleapster_telem_update_screen();", txt, count=1)
                      mod = mod or (n > 0)
                  m_delay = re.search(r"void\s+OSystem_libretro::delayMillis\s*\(\s*uint\s+(\w+)\s*\)\s*\{", txt)
                  if m_delay:
                      p = m_delay.group(1)
                      s_idx, b_idx = m_delay.start(), m_delay.end() - 1
                      depth, e_idx = 0, -1
                      for idx in range(b_idx, len(txt)):
                          if txt[idx] == "{": depth += 1
                          elif txt[idx] == "}":
                              depth -= 1
                              if depth == 0: e_idx = idx + 1; break
                      m_chk = re.search(r"\(\(LibretroTimerManager\s*\*\)\s*_timerManager\)->checkThread\([^)]*\)", txt[b_idx:e_idx])
                      chk = m_chk.group(0) if m_chk else "((LibretroTimerManager *)_timerManager)->checkThread(THREAD_SWITCH_DELAY)"
                      # Fast yield for <=12ms engine loop polls (fixes Lion King 640x480 stall); exact wait for >12ms
                      new_fn = (
                          f"void OSystem_libretro::delayMillis(uint {p}) {{\n"
                          f"\tuint32 start_time = getMillis();\n"
                          f"\tif ({p} == 0) {{ {chk}; return; }}\n"
                          f"\tif ({p} <= 12) {{\n"
                          f"\t\tif (!{chk}) leapster_sleep_us(1000);\n"
                          f"\t\tleapster_telem_delay({p}, getMillis() - start_time);\n"
                          f"\t\treturn;\n"
                          f"\t}}\n"
                          f"\tuint32 elapsed_time = 0;\n"
                          f"\twhile (elapsed_time < {p}) {{\n"
                          f"\t\tif (!{chk}) leapster_sleep_us(1000);\n"
                          f"\t\telapsed_time = getMillis() - start_time;\n"
                          f"\t}}\n"
                          f"\tleapster_telem_delay({p}, elapsed_time);\n}}"
                      )
                      txt = txt[:s_idx] + new_fn + txt[e_idx:]
                      mod = True
                  if mod:
                      with open(fpath, "w") as f:
                          f.write(extern_decls + "\n" + txt)

          # 7. Patch libretro-core.cpp: Touch + Real-Time Audio Catch-Up Mixer + V8 Telemetry
          core_path = "backends/platform/libretro/src/libretro-core.cpp"
          with open(core_path, "r") as f:
              ctxt = f.read()

          leapster_core_hook = r"""
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <time.h>
          #include <linux/input.h>
          #include <sys/ioctl.h>

          static retro_input_state_t g_leapster_orig_input_cb = NULL;
          static retro_audio_sample_batch_t g_leapster_orig_audio_batch_cb = NULL;
          static int g_ts_fd = -2;
          static char g_ts_dev_name[64] = "none";
          static int g_ts_cur_x = 160, g_ts_cur_y = 120, g_ts_raw_x = 160, g_ts_raw_y = 120, g_ts_touch = 0;
          static int g_ts_min_x = 0, g_ts_max_x = 319, g_ts_min_y = 0, g_ts_max_y = 239;
          static int g_use_pcal = 0;
          static long g_pcal[7] = {1, 0, 0, 0, 1, 0, 1};
          static bool g_ts_ever_touched = false;
          static int16_t g_ts_retro_x = 0, g_ts_retro_y = 0, g_ts_retro_press = 0;
          static int g_ts_click_state = 0, g_ts_last_sx = 160, g_ts_last_sy = 120;

          static FILE *g_telem_fp = NULL;
          static uint64_t g_telem_start_us = 0, g_telem_window_start_us = 0, g_leapster_last_frame_us = 0;
          static uint32_t g_telem_retro_runs = 0, g_telem_update_screens = 0;
          static uint32_t g_telem_delay_calls = 0, g_telem_delay_req_ms = 0, g_telem_delay_actual_ms = 0;
          static uint32_t g_telem_audio_frames = 0, g_telem_extra_audio_frames = 0, g_telem_sec_counter = 0;
          static uint32_t g_frame_audio_sent = 0;
          static int32_t g_audio_deficit_frames = 0;

          static uint64_t leapster_monotonic_us(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (uint64_t)ts.tv_sec * 1000000ULL + (uint64_t)(ts.tv_nsec / 1000ULL);
          }
          extern "C" unsigned int leapster_hw_get_millis(void) {
              uint64_t now_us = leapster_monotonic_us();
              if (g_telem_start_us == 0) g_telem_start_us = now_us;
              return (unsigned int)((now_us - g_telem_start_us) / 1000ULL);
          }
          extern "C" void leapster_sleep_us(unsigned int us) { usleep((useconds_t)us); }
          extern "C" void leapster_telem_delay(unsigned int req_ms, unsigned int actual_ms) {
              g_telem_delay_calls++; g_telem_delay_req_ms += req_ms; g_telem_delay_actual_ms += actual_ms;
          }
          extern "C" void leapster_telem_update_screen(void) { g_telem_update_screens++; }

          static size_t leapster_audio_batch_cb(const int16_t *data, size_t frames) {
              g_frame_audio_sent += (uint32_t)frames;
              g_telem_audio_frames += (uint32_t)frames;
              return g_leapster_orig_audio_batch_cb ? g_leapster_orig_audio_batch_cb(data, frames) : frames;
          }

          #define LEAP_BITS_PER_LONG (sizeof(unsigned long) * 8)
          #define LEAP_NBITS(x) ((((x) - 1) / LEAP_BITS_PER_LONG) + 1)
          #define LEAP_TEST_BIT(b, a) ((a[(b) / LEAP_BITS_PER_LONG] >> ((b) % LEAP_BITS_PER_LONG)) & 1)

          static void leapster_init_touch(void) {
              if (g_ts_fd != -2) return;
              g_ts_fd = -1;
              FILE *pf = fopen("/etc/pointercal", "r");
              if (pf) {
                  if (fscanf(pf, "%ld %ld %ld %ld %ld %ld %ld", &g_pcal[0], &g_pcal[1], &g_pcal[2],
                             &g_pcal[3], &g_pcal[4], &g_pcal[5], &g_pcal[6]) == 7 && g_pcal[6] != 0)
                      g_use_pcal = 1;
                  fclose(pf);
              }
              for (int i = 0; i < 8; i++) {
                  char devpath[32], name[64] = {0};
                  snprintf(devpath, sizeof(devpath), "/dev/input/event%d", i);
                  int fd = open(devpath, O_RDONLY | O_NONBLOCK);
                  if (fd < 0) continue;
                  ioctl(fd, EVIOCGNAME(sizeof(name) - 1), name);
                  if (strstr(name, "aclmtr") || strstr(name, "accel") || strstr(name, "Accel")) { close(fd); continue; }
                  unsigned long evbit[LEAP_NBITS(EV_MAX)] = {0}, absbit[LEAP_NBITS(ABS_MAX)] = {0}, keybit[LEAP_NBITS(KEY_MAX)] = {0};
                  if (ioctl(fd, EVIOCGBIT(0, sizeof(evbit)), evbit) >= 0 && LEAP_TEST_BIT(EV_ABS, evbit) &&
                      ioctl(fd, EVIOCGBIT(EV_ABS, sizeof(absbit)), absbit) >= 0 && LEAP_TEST_BIT(ABS_X, absbit) && LEAP_TEST_BIT(ABS_Y, absbit)) {
                      ioctl(fd, EVIOCGBIT(EV_KEY, sizeof(keybit)), keybit);
                      if (LEAP_TEST_BIT(BTN_TOUCH, keybit) || LEAP_TEST_BIT(BTN_LEFT, keybit) || strstr(name, "touch") || strstr(name, "ts")) {
                          g_ts_fd = fd; snprintf(g_ts_dev_name, sizeof(g_ts_dev_name), "event%d:%s", i, name); break;
                      }
                  }
                  close(fd);
              }
              if (g_ts_fd >= 0) {
                  struct input_absinfo ax, ay;
                  if (ioctl(g_ts_fd, EVIOCGABS(ABS_X), &ax) >= 0 && ax.maximum > ax.minimum) { g_ts_min_x = ax.minimum; g_ts_max_x = ax.maximum; }
                  if (ioctl(g_ts_fd, EVIOCGABS(ABS_Y), &ay) >= 0 && ay.maximum > ay.minimum) { g_ts_min_y = ay.minimum; g_ts_max_y = ay.maximum; }
              }
          }

          static void leapster_poll_touch_frame(void) {
              leapster_init_touch();
              if (g_ts_fd < 0) return;
              struct input_event ev;
              bool down_now = false;
              while (read(g_ts_fd, &ev, sizeof(ev)) == (ssize_t)sizeof(ev)) {
                  if (ev.type == EV_ABS) {
                      if (ev.code == ABS_X) g_ts_cur_x = ev.value;
                      else if (ev.code == ABS_Y) g_ts_cur_y = ev.value;
                      else if (ev.code == ABS_PRESSURE) { g_ts_touch = (ev.value > 0) ? 1 : 0; if (g_ts_touch) down_now = true; }
                  } else if (ev.type == EV_KEY && (ev.code == BTN_TOUCH || ev.code == BTN_LEFT)) {
                      g_ts_touch = (ev.value != 0) ? 1 : 0; if (g_ts_touch) down_now = true;
                  } else if (ev.type == EV_SYN && ev.code == SYN_REPORT && g_ts_touch) {
                      g_ts_raw_x = g_ts_cur_x; g_ts_raw_y = g_ts_cur_y; g_ts_ever_touched = true;
                  }
              }
              if (g_ts_touch) { g_ts_raw_x = g_ts_cur_x; g_ts_raw_y = g_ts_cur_y; g_ts_ever_touched = true; }
              if (!g_ts_ever_touched) return;
              int sx = 0, sy = 0;
              if (g_use_pcal) {
                  sx = (int)((g_pcal[0] * (long)g_ts_raw_x + g_pcal[1] * (long)g_ts_raw_y + g_pcal[2]) / g_pcal[6]);
                  sy = (int)((g_pcal[3] * (long)g_ts_raw_x + g_pcal[4] * (long)g_ts_raw_y + g_pcal[5]) / g_pcal[6]);
              } else {
                  int rx = g_ts_max_x - g_ts_min_x, ry = g_ts_max_y - g_ts_min_y;
                  sx = (rx > 0) ? ((g_ts_raw_x - g_ts_min_x) * 320) / rx : g_ts_raw_x;
                  sy = (ry > 0) ? ((g_ts_raw_y - g_ts_min_y) * 240) / ry : g_ts_raw_y;
              }
              if (sx < 0) sx = 0; else if (sx > 319) sx = 319;
              if (sy < 0) sy = 0; else if (sy > 239) sy = 239;
              g_ts_last_sx = sx; g_ts_last_sy = sy;
              g_ts_retro_x = (int16_t)(((long)sx * 0xffffL) / 320L - 0x7fffL);
              g_ts_retro_y = (int16_t)(((long)sy * 0xffffL) / 240L - 0x7fffL);
              if (g_ts_click_state == 0) {
                  g_ts_retro_press = 0;
                  if (g_ts_touch || down_now) g_ts_click_state = 1;
              } else if (g_ts_click_state == 1) {
                  g_ts_retro_press = 1; g_ts_click_state = 2;
              } else {
                  if (g_ts_touch) g_ts_retro_press = 1;
                  else { g_ts_retro_press = 0; g_ts_click_state = 0; }
              }
          }

          static void leapster_tick_pacing_and_audio(void) {
              const uint64_t frame_budget_us = 16667ULL;
              uint64_t now_us = leapster_monotonic_us();
              if (g_leapster_last_frame_us != 0 && now_us > g_leapster_last_frame_us) {
                  uint64_t elapsed_us = now_us - g_leapster_last_frame_us;
                  if (elapsed_us < frame_budget_us) {
                      usleep((useconds_t)(frame_budget_us - elapsed_us));
                      now_us = leapster_monotonic_us();
                      elapsed_us = now_us - g_leapster_last_frame_us;
                  }
                  // Audio catch-up when a 640x480 frame took longer than 16.67ms
                  if (g_system && g_system->getMixer() && g_leapster_orig_audio_batch_cb && g_frame_audio_sent > 0) {
                      uint32_t sr = g_system->getMixer()->getOutputRate();
                      if (sr < 8000 || sr > 96000) sr = 44100;
                      uint64_t clamped_us = (elapsed_us > 80000ULL) ? 80000ULL : elapsed_us;
                      int32_t needed = (int32_t)((clamped_us * (uint64_t)sr) / 1000000ULL);
                      g_audio_deficit_frames += (needed - (int32_t)g_frame_audio_sent);
                      if (g_audio_deficit_frames < -735) g_audio_deficit_frames = -735;
                      if (g_audio_deficit_frames > 2940) g_audio_deficit_frames = 2940;
                      if (g_audio_deficit_frames >= 256) {
                          int16_t extra_pcm[1470 * 2];
                          uint32_t chunk = (g_audio_deficit_frames > 1470) ? 1470 : (uint32_t)g_audio_deficit_frames;
                          ((Audio::MixerImpl *)g_system->getMixer())->mixCallback((byte *)extra_pcm, chunk * 4);
                          g_leapster_orig_audio_batch_cb(extra_pcm, chunk);
                          g_telem_audio_frames += chunk;
                          g_telem_extra_audio_frames += chunk;
                          g_audio_deficit_frames -= (int32_t)chunk;
                      }
                  }
              }
              g_frame_audio_sent = 0;
              g_leapster_last_frame_us = now_us;

              if (!g_telem_fp) {
                  g_telem_fp = fopen("/roms/scummvm_telemetry.log", "w");
                  if (!g_telem_fp) g_telem_fp = fopen("/tmp/scummvm_telemetry.log", "w");
                  if (g_telem_fp) {
                      fprintf(g_telem_fp, "=== ScummVM LeapsterGS V8 Telemetry Log ===\n");
                      fprintf(g_telem_fp, "Touchscreen: %s | pointercal=%d\n", g_ts_dev_name, g_use_pcal);
                      fprintf(g_telem_fp, "sec | wall_ms | r_fps | u_scr | aud_ms | xtra_ms | d_call | d_req | d_wait | touch\n");
                      fflush(g_telem_fp);
                  }
                  g_telem_window_start_us = now_us;
              }
              g_telem_retro_runs++;
              if (now_us - g_telem_window_start_us >= 1000000ULL) {
                  g_telem_sec_counter++;
                  uint32_t wall_ms = (uint32_t)((now_us - g_telem_window_start_us) / 1000ULL);
                  uint32_t aud_ms = (g_telem_audio_frames * 1000U) / 44100U;
                  uint32_t xtra_ms = (g_telem_extra_audio_frames * 1000U) / 44100U;
                  if (g_telem_fp && g_telem_sec_counter <= 600) {
                      fprintf(g_telem_fp, "%3u | %7u | %5u | %5u | %6u | %7u | %6u | %5u | %6u | (%d,%d,%d)\n",
                              g_telem_sec_counter, wall_ms, g_telem_retro_runs, g_telem_update_screens,
                              aud_ms, xtra_ms, g_telem_delay_calls, g_telem_delay_req_ms, g_telem_delay_actual_ms,
                              g_ts_last_sx, g_ts_last_sy, (int)g_ts_retro_press);
                      fflush(g_telem_fp);
                  }
                  g_telem_window_start_us = now_us;
                  g_telem_retro_runs = 0; g_telem_update_screens = 0;
                  g_telem_delay_calls = 0; g_telem_delay_req_ms = 0; g_telem_delay_actual_ms = 0;
                  g_telem_audio_frames = 0; g_telem_extra_audio_frames = 0;
              }
          }

          static int16_t leapster_input_state_cb(unsigned port, unsigned device, unsigned index, unsigned id) {
              if ((device & 0xff) == RETRO_DEVICE_POINTER && port == 0 && index == 0 && g_ts_ever_touched) {
                  if (id == RETRO_DEVICE_ID_POINTER_X) return g_ts_retro_x;
                  if (id == RETRO_DEVICE_ID_POINTER_Y) return g_ts_retro_y;
                  if (id == RETRO_DEVICE_ID_POINTER_PRESSED) return g_ts_retro_press;
              }
              return g_leapster_orig_input_cb ? g_leapster_orig_input_cb(port, device, index, id) : 0;
          }
          """

          m_in = re.search(r"void\s+retro_set_input_state\s*\(\s*retro_input_state_t\s+\w+\s*\)\s*\{", ctxt)
          m_aud = re.search(r"void\s+retro_set_audio_sample_batch\s*\(\s*retro_audio_sample_batch_t\s+\w+\s*\)\s*\{", ctxt)
          m_run = re.search(r"void\s+retro_run\s*\(\s*(?:void)?\s*\)\s*\{", ctxt)
          pos = min(m_in.start(), m_aud.start(), m_run.start())
          ctxt = ctxt[:pos] + leapster_core_hook + "\n" + ctxt[pos:]

          ctxt, _ = re.subn(
              r"(void\s+retro_set_input_state\s*\(\s*retro_input_state_t\s+(\w+)\s*\)\s*\{)",
              r"\1\n\tg_leapster_orig_input_cb = \2;\n\t\2 = leapster_input_state_cb;", ctxt, count=1)

          ctxt, _ = re.subn(
              r"(void\s+retro_set_audio_sample_batch\s*\(\s*retro_audio_sample_batch_t\s+(\w+)\s*\)\s*\{)",
              r"\1\n\tg_leapster_orig_audio_batch_cb = \2;\n\t\2 = leapster_audio_batch_cb;", ctxt, count=1)

          ctxt, _ = re.subn(
              r"(void\s+retro_run\s*\(\s*(?:void)?\s*\)\s*\{)",
              r"\1\n\tleapster_poll_touch_frame();\n\tleapster_tick_pacing_and_audio();", ctxt, count=1)

          with open(core_path, "w") as f:
              f.write(ctxt)

          # 8. Inject Cortex-A9 compiler flags into Makefile
          mk_file = "backends/platform/libretro/Makefile"
          with open(mk_file, "r") as f:
              mk = f.read()
          opt_flags = "-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG -DPNG_ARM_NEON_OPT=0 -fPIC"
          inject_block = f"\nTARGET_64BIT := 0\nHIGH_DEF := 1\nOPENGL_SUPPORT := 0\nUSE_OPENGL := 0\nHAVE_OPENGL := 0\nUSE_IMGUI := 0\nUSE_CURL := 0\nUSE_LIBCURL := 0\nUSE_CLOUD := 0\nUSE_BASIC_NET := 0\nUSE_SDL_NET := 0\nUSE_ALSA := 0\nHAVE_NEON := 0\nCFLAGS += {opt_flags}\nCXXFLAGS += {opt_flags}\nLDFLAGS += -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc -lpthread -lm -ldl\n"
          mk = mk.replace("include $(ROOT_PATH)/Makefile.common", inject_block + "\ninclude $(ROOT_PATH)/Makefile.common")
          mk = mk.replace("include Makefile.common", inject_block + "\ninclude Makefile.common")
          with open(mk_file, "w") as f:
              f.write(mk)
          EOF

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work/scummvm-2026.4.0/backends/platform/libretro ubuntu:18.04 bash -c '
            set -e
            set -o pipefail
            apt-get update
            apt-get install -y git ca-certificates pkg-config gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi make zip unzip sed gawk

            export CC="arm-linux-gnueabi-gcc"
            export CXX="arm-linux-gnueabi-g++"
            export AR="arm-linux-gnueabi-ar cru"
            export RANLIB="arm-linux-gnueabi-ranlib"
            export AS="arm-linux-gnueabi-as"
            export LD="arm-linux-gnueabi-g++"
            export STRIP="arm-linux-gnueabi-strip"

            make platform=unix ARCH=arm TARGET_64BIT=0 HIGH_DEF=1 CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" LD="$LD" LITE=1 NO_WIP=0 OPENGL_SUPPORT=0 USE_OPENGL=0 HAVE_OPENGL=0 USE_IMGUI=0 USE_CURL=0 USE_LIBCURL=0 USE_CLOUD=0 USE_BASIC_NET=0 USE_SDL_NET=0 USE_ALSA=0 USE_SEQ_MIDI=0 USE_SNDIO=0 USE_TIMIDITY=0 USE_MT32EMU=0 USE_FLUIDSYNTH=0 USE_FLAC=0 USE_VORBIS=0 USE_TREMOR=0 USE_MAD=0 USE_FAAD=0 USE_MPEG2=0 USE_THEORADEC=0 USE_FREETYPE2=0 USE_FRIBIDI=0 USE_PNG=1 USE_ZLIB=1 USE_JPEG=1 HAVE_NEON=0 -j$(nproc) all 2>&1 | tee /work/build_scummvm.log

            $STRIP -s scummvm_libretro.so
            cp scummvm_libretro.so /work/scummvm_libretro.so
            if [ -f scummvm.zip ]; then cp scummvm.zip /work/scummvm.zip; fi
            if [ -f scummvm_libretro.info ]; then cp scummvm_libretro.info /work/scummvm_libretro.info; fi
          '

      - name: Upload ScummVM Libretro Core V8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummvm_libretro_leapster_v8
          path: |
            scummvm_libretro.so
            scummvm.zip
            scummvm_libretro.info
            build_scummvm.log
